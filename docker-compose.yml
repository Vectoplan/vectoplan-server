  vectoplan-chunk-db:
    <<: *vectoplan-service-defaults
    image: postgres:16-alpine
    environment:
      <<: *vectoplan-chunk-postgres-environment
    ports:
      - "${VECTOPLAN_HOST_BIND:-127.0.0.1}:${VECTOPLAN_CHUNK_POSTGRES_PUBLIC_PORT:-15433}:5432"
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1 -p 5432"
        ]
      interval: "${VECTOPLAN_CHUNK_DB_HEALTH_INTERVAL:-10s}"
      timeout: "${VECTOPLAN_CHUNK_DB_HEALTH_TIMEOUT:-5s}"
      retries: ${VECTOPLAN_CHUNK_DB_HEALTH_RETRIES:-10}
      start_period: "${VECTOPLAN_CHUNK_DB_HEALTH_START_PERIOD:-10s}"
    volumes:
      - vectoplan-chunk-postgres-data:/var/lib/postgresql/data
    networks:
      vectoplan-net:
        aliases:
          - vectoplan-chunk-db
          - chunk-db

  vectoplan-chunk-init:
    <<: *vectoplan-init-service-defaults
    build:
      context: ./services/vectoplan-chunk
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_HOME: "/opt/vectoplan/services/vectoplan-chunk"
        APP_USER: "vectoplan"
        APP_UID: "${VECTOPLAN_CHUNK_UID:-10003}"
        APP_GID: "${VECTOPLAN_CHUNK_GID:-10003}"

    working_dir: /opt/vectoplan/services/vectoplan-chunk

    # The one-shot init owns persistent runtime directories, then exits. The
    # long-running service continues as the unprivileged vectoplan user.
    user: '0:0'

    volumes:
      - vectoplan-chunk-terrain-cache:/var/lib/vectoplan-chunk/terrain-cache

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      <<: *vectoplan-chunk-init-environment

    depends_on:
      vectoplan-chunk-db:
        condition: service_healthy

    entrypoint:
      - /bin/sh
      - -ec

    command:
      - |
        set -eu

        SERVICE_TAG="[vectoplan-chunk-init]"
        mkdir -p /var/lib/vectoplan-chunk/terrain-cache
        chown -R "$${VECTOPLAN_CHUNK_RUNTIME_UID}:$${VECTOPLAN_CHUNK_RUNTIME_GID}" /var/lib/vectoplan-chunk/terrain-cache
        cd /opt/vectoplan/services/vectoplan-chunk

        on_error() {
          code="$?"
          echo "$${SERVICE_TAG} ERROR: DB-Bootstrap ist fehlgeschlagen. Exit-Code: $${code}" >&2
          echo "$${SERVICE_TAG} PWD: $(pwd)" >&2
          echo "$${SERVICE_TAG} Inhalt des Arbeitsverzeichnisses:" >&2
          ls -la >&2 || true
          exit "$${code}"
        }

        trap on_error INT TERM HUP

        echo "$${SERVICE_TAG} Starte expliziten Chunk-DB-Bootstrap."

        if [ "$${VECTOPLAN_CHUNK_INIT_PRINT_ENV_SUMMARY:-true}" = "true" ]; then
          echo "$${SERVICE_TAG} DB host=$${VECTOPLAN_CHUNK_DB_HOST:-vectoplan-chunk-db}"
          echo "$${SERVICE_TAG} DB port=$${VECTOPLAN_CHUNK_DB_PORT:-5432}"
          echo "$${SERVICE_TAG} DB name=$${VECTOPLAN_CHUNK_DB_NAME:-vectoplan_chunk}"
          echo "$${SERVICE_TAG} default_project=$${VECTOPLAN_CHUNK_DEFAULT_PROJECT_ID:-dev-project}"
          echo "$${SERVICE_TAG} default_universe=$${VECTOPLAN_CHUNK_DEFAULT_UNIVERSE_ID:-dev-universe}"
          echo "$${SERVICE_TAG} default_world=$${VECTOPLAN_CHUNK_DEFAULT_WORLD_ID:-world_spawn}"
          echo "$${SERVICE_TAG} default_instance_world=$${VECTOPLAN_CHUNK_DEFAULT_INSTANCE_WORLD_ID:-world_spawn}"
          echo "$${SERVICE_TAG} default_template=$${VECTOPLAN_CHUNK_DEFAULT_TEMPLATE_ID:-flat}"
          echo "$${SERVICE_TAG} default_provider_world=$${VECTOPLAN_CHUNK_DEFAULT_PROVIDER_WORLD_ID:-flat}"
          echo "$${SERVICE_TAG} create_all=$${VECTOPLAN_CHUNK_AUTO_CREATE_ALL:-true}"
          echo "$${SERVICE_TAG} seed_defaults=$${VECTOPLAN_CHUNK_AUTO_SEED_DEFAULTS:-true}"
          echo "$${SERVICE_TAG} repair_missing_columns=$${VECTOPLAN_CHUNK_BOOTSTRAP_REPAIR_MISSING_COLUMNS:-true}"
        fi

        if [ ! -f ./scripts/bootstrap_db.py ]; then
          echo "$${SERVICE_TAG} ERROR: ./scripts/bootstrap_db.py wurde nicht gefunden." >&2
          echo "$${SERVICE_TAG} Erwartet unter: /opt/vectoplan/services/vectoplan-chunk/scripts/bootstrap_db.py" >&2
          exit 1
        fi

        max_attempts="$${VECTOPLAN_CHUNK_INIT_MAX_ATTEMPTS:-5}"
        retry_seconds="$${VECTOPLAN_CHUNK_INIT_RETRY_SECONDS:-3}"
        attempt="1"

        while [ "$${attempt}" -le "$${max_attempts}" ]; do
          echo "$${SERVICE_TAG} Bootstrap-Versuch $${attempt}/$${max_attempts} ..."

          set +e
          python ./scripts/bootstrap_db.py \
            --config "$${VECTOPLAN_CHUNK_CONFIG:-development}" \
            --create-all \
            --repair-missing-columns \
            --seed \
            --json
          code="$?"
          set -e

          if [ "$${code}" -eq 0 ]; then
            echo "$${SERVICE_TAG} Chunk-DB-Bootstrap erfolgreich abgeschlossen."
            exit 0
          fi

          echo "$${SERVICE_TAG} Bootstrap-Versuch $${attempt} ist fehlgeschlagen. Exit-Code: $${code}" >&2

          if [ "$${attempt}" -ge "$${max_attempts}" ]; then
            echo "$${SERVICE_TAG} ERROR: Max. Bootstrap-Versuche erreicht." >&2
            exit "$${code}"
          fi

          echo "$${SERVICE_TAG} Warte $${retry_seconds}s vor erneutem Versuch ..."
          sleep "$${retry_seconds}"
          attempt="$((attempt + 1))"
        done

        echo "$${SERVICE_TAG} ERROR: Unerwartetes Ende des Bootstrap-Loops." >&2
        exit 1

    networks:
      vectoplan-net:
        aliases:
          - vectoplan-chunk-init
          - chunk-init

  vectoplan-chunk:
    <<: *vectoplan-service-defaults
    build:
      context: ./services/vectoplan-chunk
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_HOME: "/opt/vectoplan/services/vectoplan-chunk"
        APP_USER: "vectoplan"
        APP_UID: "${VECTOPLAN_CHUNK_UID:-10003}"
        APP_GID: "${VECTOPLAN_CHUNK_GID:-10003}"

    working_dir: /opt/vectoplan/services/vectoplan-chunk

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      <<: *vectoplan-chunk-environment

    volumes:
      - vectoplan-chunk-terrain-cache:/var/lib/vectoplan-chunk/terrain-cache

    depends_on:
      vectoplan-chunk-db:
        condition: service_healthy
      vectoplan-chunk-init:
        condition: service_completed_successfully

    ports:
      - "${VECTOPLAN_HOST_BIND:-127.0.0.1}:${VECTOPLAN_CHUNK_PUBLIC_PORT:-5102}:5000"

    expose:
      - "5000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - <<'PY'\nimport json\nimport os\nimport sys\nimport urllib.request\npaths = [p.strip() for p in os.environ.get('VECTOPLAN_CHUNK_HEALTHCHECK_PATH', '/projects/_status').split(',') if p.strip()]\npaths.extend(['/projects/_status', '/chunks/_status', '/commands/_status', '/'])\nrequire_ok = os.environ.get('VECTOPLAN_CHUNK_HEALTHCHECK_REQUIRE_OK', 'true').strip().lower() not in {'0', 'false', 'no', 'off'}\nseen = []\nfor path in paths:\n    if path in seen:\n        continue\n    seen.append(path)\n    try:\n        resp = urllib.request.urlopen('http://127.0.0.1:5000' + path, timeout=3)\n        status = getattr(resp, 'status', 200)\n        body = resp.read(1024 * 1024).decode('utf-8', 'replace')\n        if not (200 <= status < 400):\n            continue\n        if not require_ok:\n            sys.exit(0)\n        try:\n            payload = json.loads(body or '{}')\n        except Exception:\n            if path == '/':\n                sys.exit(0)\n            continue\n        if payload.get('ok') is True:\n            sys.exit(0)\n        if payload.get('status') in {'ready', 'ok', 'healthy'} and payload.get('ok') is not False:\n            sys.exit(0)\n    except Exception:\n        pass\nsys.exit(1)\nPY"
        ]
      interval: "${VECTOPLAN_CHUNK_HEALTH_INTERVAL:-20s}"
      timeout: "${VECTOPLAN_CHUNK_HEALTH_TIMEOUT:-5s}"
      retries: ${VECTOPLAN_CHUNK_HEALTH_RETRIES:-8}
      start_period: "${VECTOPLAN_CHUNK_HEALTH_START_PERIOD:-45s}"

    networks:
      vectoplan-net:
        aliases:
          - vectoplan-chunk
          - chunk
      vectoplan-shared:
        aliases:
          - vectoplan-chunk
          - server-chunk
      vectoplan:
        aliases:
          - server-chunk

