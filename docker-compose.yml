  VECTOPLAN_CHUNK_PROJECT_PROVISIONING_ENABLED: "${VECTOPLAN_CHUNK_PROJECT_PROVISIONING_ENABLED:-true}"
  VECTOPLAN_CHUNK_PROJECT_PROVISIONING_IDEMPOTENT: "${VECTOPLAN_CHUNK_PROJECT_PROVISIONING_IDEMPOTENT:-true}"
  VECTOPLAN_CHUNK_PROJECT_PROVISIONING_DEFAULT_TEMPLATE_ID: "${VECTOPLAN_CHUNK_PROJECT_PROVISIONING_DEFAULT_TEMPLATE_ID:-earth}"
  VECTOPLAN_CHUNK_PROJECT_PROVISIONING_FALLBACK_TEMPLATE_ID: "${VECTOPLAN_CHUNK_PROJECT_PROVISIONING_FALLBACK_TEMPLATE_ID:-flat}"
  VECTOPLAN_CHUNK_PROJECT_PROVISIONING_ALLOW_FALLBACK: "${VECTOPLAN_CHUNK_PROJECT_PROVISIONING_ALLOW_FALLBACK:-true}"
  VECTOPLAN_CHUNK_PROJECT_PROVISIONING_ALLOW_TEMPLATE_CHANGE: "${VECTOPLAN_CHUNK_PROJECT_PROVISIONING_ALLOW_TEMPLATE_CHANGE:-false}"
  VECTOPLAN_CHUNK_PROJECT_PROVISIONING_FALLBACK_ERROR_CODES: "${VECTOPLAN_CHUNK_PROJECT_PROVISIONING_FALLBACK_ERROR_CODES:-coordinates_unavailable,earth_reference_missing,earth_reference_required,earth_reference_incomplete,earth_reference_invalid,earth_reference_not_available,invalid_earth_reference,project_coordinates_unavailable,unsupported_coordinate_reference}"
  VECTOPLAN_CHUNK_PROJECT_PROVISIONING_DEFAULT_WORLD_ID: "${VECTOPLAN_CHUNK_PROJECT_PROVISIONING_DEFAULT_WORLD_ID:-world_spawn}"
  VECTOPLAN_CHUNK_PROJECT_PROVISIONING_SOURCE_SERVICE: "${VECTOPLAN_CHUNK_PROJECT_PROVISIONING_SOURCE_SERVICE:-vectoplan-app}"
  VECTOPLAN_CHUNK_EARTH_CRS_ID: "${VECTOPLAN_CHUNK_EARTH_CRS_ID:-EPSG:4979}"
  VECTOPLAN_CHUNK_DEFAULT_EARTH_HEIGHT: "${VECTOPLAN_CHUNK_DEFAULT_EARTH_HEIGHT:-0.0}"

  # Approved geodata releases used by the Earth-only terrain pipeline.
  # Raw DGM files remain in the Webscraper object store; this service persists
  # only derived, release-keyed voxel chunks in its own cache volume.
  GEOSERVER_ORCHESTRATOR_INTERNAL_URL: "${GEOSERVER_ORCHESTRATOR_INTERNAL_URL:-http://geoserver-orchestrator:8010}"
  GEOSERVER_INTERNAL_BASE_URL: "${GEOSERVER_INTERNAL_BASE_URL:-http://geoserver:8080/geoserver}"
  VECTOPLAN_CHUNK_GEODATA_SERVICE_TOKEN: "${VECTOPLAN_PRODUCTION_PUBLICATION_SERVICE_TOKEN:?Set VECTOPLAN_PRODUCTION_PUBLICATION_SERVICE_TOKEN in .env}"
  VECTOPLAN_CHUNK_GEODATA_OVERLAYS_ENABLED: "${VECTOPLAN_CHUNK_GEODATA_OVERLAYS_ENABLED:-true}"
  VECTOPLAN_CHUNK_GEODATA_OVERLAYS_JSON: "${VECTOPLAN_CHUNK_GEODATA_OVERLAYS_JSON:-}"
  # Response-only overlays are optional.  A missing Bigdata/GeoServer stack
  # must never hold editable chunks (and therefore the whole 3D editor) open.
  VECTOPLAN_CHUNK_GEODATA_OVERLAY_TIMEOUT_SECONDS: "${VECTOPLAN_CHUNK_GEODATA_OVERLAY_TIMEOUT_SECONDS:-1.5}"
  VECTOPLAN_CHUNK_GEODATA_OVERLAY_VERSION_CACHE_SECONDS: "${VECTOPLAN_CHUNK_GEODATA_OVERLAY_VERSION_CACHE_SECONDS:-60}"
  VECTOPLAN_CHUNK_GEODATA_OVERLAY_TILE_CACHE_SECONDS: "${VECTOPLAN_CHUNK_GEODATA_OVERLAY_TILE_CACHE_SECONDS:-30}"
  VECTOPLAN_CHUNK_TERRAIN_ENABLED: "${VECTOPLAN_CHUNK_TERRAIN_ENABLED:-true}"
  VECTOPLAN_CHUNK_TERRAIN_CACHE_DIR: "/var/lib/vectoplan-chunk/terrain-cache"
  # Immutable, project-selected Editor bundles share the existing persistent
