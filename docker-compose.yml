  VECTOPLAN_CHUNK_SERVICE_API_KEY_HEADERS: "${VECTOPLAN_CHUNK_SERVICE_API_KEY_HEADERS:-Authorization,X-API-Key,X-Vectoplan-Internal-Token}"
