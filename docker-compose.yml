      <<: *vectoplan-statik-environment

    ports:
      - "${VECTOPLAN_HOST_BIND:-127.0.0.1}:${VECTOPLAN_STATIK_PUBLIC_PORT:-5111}:5000"

    expose:
      - "5000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:5000/health/ready', timeout=3); payload = json.load(response); raise SystemExit(0 if response.status == 200 and payload.get('ok') is True else 1)\""
        ]
      interval: "${VECTOPLAN_STATIK_HEALTH_INTERVAL:-20s}"
      timeout: "${VECTOPLAN_STATIK_HEALTH_TIMEOUT:-5s}"
      retries: ${VECTOPLAN_STATIK_HEALTH_RETRIES:-5}
      start_period: "${VECTOPLAN_STATIK_HEALTH_START_PERIOD:-15s}"

    networks:
      vectoplan-net:
        aliases:
          - vectoplan-statik
          - statik
      vectoplan-shared:
        aliases:
          - vectoplan-statik
          - server-statik

  vectoplan-core-db:
    <<: *vectoplan-service-defaults
    image: postgres:16-alpine
    environment:
      <<: *vectoplan-core-postgres-environment
    ports:
      - "${VECTOPLAN_HOST_BIND:-127.0.0.1}:${VECTOPLAN_CORE_POSTGRES_PUBLIC_PORT:-15437}:5432"
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1 -p 5432"
        ]
      interval: "${VECTOPLAN_CORE_DB_HEALTH_INTERVAL:-10s}"
      timeout: "${VECTOPLAN_CORE_DB_HEALTH_TIMEOUT:-5s}"
      retries: ${VECTOPLAN_CORE_DB_HEALTH_RETRIES:-10}
      start_period: "${VECTOPLAN_CORE_DB_HEALTH_START_PERIOD:-10s}"
    volumes:
      - vectoplan-core-postgres-data:/var/lib/postgresql/data
    networks:
      vectoplan-net:
        aliases:
          - vectoplan-core-db
          - core-db

  vectoplan-core-init:
    <<: *vectoplan-init-service-defaults
    build:
      context: ./services/vectoplan-core
      dockerfile: Dockerfile
      target: runtime
    working_dir: /opt/vectoplan/services/vectoplan-core
    environment:
      <<: *vectoplan-core-environment
      VECTOPLAN_CORE_AUTO_CREATE_SCHEMA: "true"
      VECTOPLAN_CORE_STRICT_STARTUP: "false"
    depends_on:
      vectoplan-core-db:
        condition: service_healthy
    entrypoint:
      - python
      - ./scripts/bootstrap_db.py
    networks:
      vectoplan-net:
        aliases:
          - vectoplan-core-init

  vectoplan-core:
    <<: *vectoplan-service-defaults
    build:
      context: ./services/vectoplan-core
      dockerfile: Dockerfile
      target: runtime
    working_dir: /opt/vectoplan/services/vectoplan-core
    environment:
      <<: *vectoplan-core-environment
    depends_on:
      vectoplan-core-db:
        condition: service_healthy
      vectoplan-core-init:
        condition: service_completed_successfully
      vectoplan-chunk:
        condition: service_healthy
    ports:
      - "${VECTOPLAN_HOST_BIND:-127.0.0.1}:${VECTOPLAN_CORE_PUBLIC_PORT:-5106}:5000"
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:5000/health/ready', timeout=3); payload = json.load(response); raise SystemExit(0 if response.status == 200 and payload.get('ok') is True else 1)\""
        ]
      interval: "${VECTOPLAN_CORE_HEALTH_INTERVAL:-20s}"
      timeout: "${VECTOPLAN_CORE_HEALTH_TIMEOUT:-5s}"
      retries: ${VECTOPLAN_CORE_HEALTH_RETRIES:-8}
      start_period: "${VECTOPLAN_CORE_HEALTH_START_PERIOD:-30s}"
    volumes:
      - vectoplan-core-storage:/var/lib/vectoplan-core/storage
    networks:
      vectoplan-net:
        aliases:
          - vectoplan-core
          - core
      vectoplan-shared:
        aliases:
          - vectoplan-core
          - server-core

  vectoplan-app-db:
    <<: *vectoplan-service-defaults
    image: postgres:16-alpine

    environment:
      <<: *vectoplan-app-postgres-environment

    ports:
      - "${VECTOPLAN_HOST_BIND:-127.0.0.1}:${VECTOPLAN_APP_POSTGRES_PUBLIC_PORT:-15435}:5432"

    expose:
      - "5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1 -p 5432"
        ]
      interval: "${VECTOPLAN_APP_DB_HEALTH_INTERVAL:-10s}"
      timeout: "${VECTOPLAN_APP_DB_HEALTH_TIMEOUT:-5s}"
      retries: ${VECTOPLAN_APP_DB_HEALTH_RETRIES:-10}
      start_period: "${VECTOPLAN_APP_DB_HEALTH_START_PERIOD:-10s}"

    volumes:
      - vectoplan-app-postgres-data:/var/lib/postgresql/data

    networks:
      vectoplan-net:
        aliases:
          - vectoplan-app-db
          - app-db

  vectoplan-app:
    <<: *vectoplan-service-defaults

    build:
      context: ./services/vectoplan-app
      dockerfile: Dockerfile

    working_dir: /app

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      <<: *vectoplan-app-environment

    depends_on:
      vectoplan-app-db:
        condition: service_healthy
      vectoplan-library:
        condition: service_healthy
      # Project creation must not become available before Chunk is actually
      # ready; transient Docker DNS/startup errors must not be persisted.
      vectoplan-chunk:
        condition: service_healthy
      vectoplan-lv:
        condition: service_started
      vectoplan-cad:
        condition: service_started
      vectoplan-core:
        condition: service_started

    entrypoint:
      - /bin/sh
      - -ec

    command:
      - |
        set -eu

        cd /app

        if [ ! -f ./entrypoint.sh ]; then
          echo "[vectoplan-app] ERROR: ./entrypoint.sh wurde im Arbeitsverzeichnis nicht gefunden." >&2
          echo "[vectoplan-app] PWD: $(pwd)" >&2
          echo "[vectoplan-app] Inhalt:" >&2
          ls -la >&2 || true
          exit 1
        fi

        sed -i 's/\r$//' ./entrypoint.sh 2>/dev/null || true
        chmod +x ./entrypoint.sh 2>/dev/null || true

        exec /bin/bash ./entrypoint.sh

    ports:
      - "${VECTOPLAN_HOST_BIND:-127.0.0.1}:${VECTOPLAN_APP_PUBLIC_PORT:-5103}:${VECTOPLAN_APP_INTERNAL_PORT:-8000}"

    expose:
      - "${VECTOPLAN_APP_INTERNAL_PORT:-8000}"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - <<'PY'\nimport os, socket, sys, urllib.request\nport = int(os.getenv('PORT', '8000'))\nbase = f'http://127.0.0.1:{port}'\nfor path in ('/ready', '/health/ready', '/healthz', '/ui', '/'):\n    try:\n        resp = urllib.request.urlopen(base + path, timeout=3)\n        status = getattr(resp, 'status', 200)\n        if 200 <= status < 500:\n            sys.exit(0)\n    except Exception:\n        pass\ntry:\n    s = socket.create_connection(('127.0.0.1', port), 3)\n    s.close()\n    sys.exit(0)\nexcept Exception:\n    sys.exit(1)\nPY"
        ]
      interval: "${VECTOPLAN_APP_HEALTH_INTERVAL:-20s}"
      timeout: "${VECTOPLAN_APP_HEALTH_TIMEOUT:-5s}"
      retries: ${VECTOPLAN_APP_HEALTH_RETRIES:-10}
      start_period: "${VECTOPLAN_APP_HEALTH_START_PERIOD:-30s}"

    volumes:
      - ./services/vectoplan-app:/app:rw
      - vectoplan-app-media:/app/media

    networks:
      vectoplan-net:
        aliases:
          - vectoplan-app
          - app
      vectoplan-shared:
        aliases:
          - vectoplan-app
          - server-app

  vectoplan-app-reconcile-chunk:
    <<: *vectoplan-init-service-defaults
    restart: "on-failure:5"

    build:
      context: ./services/vectoplan-app
      dockerfile: Dockerfile

    working_dir: /app

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      <<: *vectoplan-app-environment

    depends_on:
      vectoplan-app:
        condition: service_healthy
      vectoplan-chunk:
        condition: service_healthy

    entrypoint:
      - python
      - ./src/scripts/reconcile_chunk_projects.py

    # Heal pending/failed persisted states after every complete stack start.
    # Provisioning and access projection are idempotent.
    command:
      - --force
      - --only
      - both
      - --json-lines

    volumes:
      - ./services/vectoplan-app:/app:rw
      - vectoplan-app-media:/app/media

    networks:
      vectoplan-net:
        aliases:
          - vectoplan-app-reconcile-chunk
      vectoplan-shared:
        aliases:
          - server-app-reconcile-chunk

  openlayer:
    <<: *vectoplan-service-defaults

    build:
      context: ./services/vectoplan-openLayer
      dockerfile: Dockerfile

    environment:
      HOST: "0.0.0.0"
      OPENLAYER_PORT: "8090"
      LOG_LEVEL: "${OPENLAYER_LOG_LEVEL:-INFO}"

      OPENLAYER_PUBLIC_URL: "${OPENLAYER_PUBLIC_URL:-http://localhost:5190}"
      OPENLAYER_PUBLIC_BASE_URL: "${OPENLAYER_PUBLIC_BASE_URL:-http://localhost:5190}"
      OPENLAYER_ROUTE: "${OPENLAYER_ROUTE:-/map}"
      OPENLAYER_EMBED_ENABLED: "${OPENLAYER_EMBED_ENABLED:-true}"
      OPENLAYER_FRAME_ANCESTORS: "${OPENLAYER_FRAME_ANCESTORS:-http://localhost:5103 http://127.0.0.1:5103}"
      OPENLAYER_ALLOWED_FRAME_PARENTS: "${OPENLAYER_ALLOWED_FRAME_PARENTS:-http://localhost:5103 http://127.0.0.1:5103}"
      VECTOPLAN_APP_PUBLIC_URL: "${VECTOPLAN_APP_PUBLIC_URL:-http://localhost:5103}"

      GEOSERVER_ORCHESTRATOR_URL: "${GEOSERVER_ORCHESTRATOR_INTERNAL_URL:-http://geoserver-orchestrator:8010}"
      GEOSERVER_ORCHESTRATOR_PUBLIC_URL: "${GEOSERVER_ORCHESTRATOR_PUBLIC_URL:-http://127.0.0.1:5109/geodaten}"
      OPENLAYER_ORCHESTRATOR_TOKEN: "${OPENLAYER_ORCHESTRATOR_TOKEN:-change-me-openlayer-internal}"
      GEOSERVER_INTERNAL_URL: "${GEOSERVER_INTERNAL_BASE_URL:-http://geoserver:8080/geoserver}"
      GEOSERVER_PUBLIC_URL: "${GEOSERVER_PUBLIC_BASE_URL:-http://127.0.0.1:5109/geoserver}"

      # Keep the same canonical token aliases as vectoplan-app. OpenLayer
      # historically read MAPBOX_TOKEN while newer code reads
      # MAPBOX_ACCESS_TOKEN; both must resolve to the exact same credential.
      MAPBOX_ACCESS_TOKEN: "${MAPBOX_ACCESS_TOKEN:-${VECTOPLAN_MAPBOX_TOKEN:-${MAPBOX_TOKEN:-}}}"
      MAPBOX_TOKEN: "${MAPBOX_ACCESS_TOKEN:-${VECTOPLAN_MAPBOX_TOKEN:-${MAPBOX_TOKEN:-}}}"
      VECTOPLAN_MAPBOX_TOKEN: "${MAPBOX_ACCESS_TOKEN:-${VECTOPLAN_MAPBOX_TOKEN:-${MAPBOX_TOKEN:-}}}"
      MAPBOX_STYLE_URL: "${MAPBOX_STYLE_URL:-}"
      MAPBOX_DEFAULT_STYLE: "${OPENLAYER_MAP_STYLE:-mapbox/light-v11}"
      DEFAULT_LON: "${VECTOPLAN_APP_GEOCODING_FALLBACK_LONGITUDE:-13.405}"
      DEFAULT_LAT: "${VECTOPLAN_APP_GEOCODING_FALLBACK_LATITUDE:-52.52}"
      ENABLE_WHEEL_ZOOM: "${OPENLAYER_ENABLE_WHEEL_ZOOM:-true}"
      DISABLE_SCROLL: "${OPENLAYER_DISABLE_SCROLL:-false}"

    ports:
      - "${VECTOPLAN_HOST_BIND:-127.0.0.1}:${OPENLAYER_PUBLIC_PORT:-5190}:8090"

    expose:
      - "8090"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - <<'PY'\nimport sys, urllib.request\nfor path in ('/ready', '/health', '/map', '/'):\n    try:\n        resp = urllib.request.urlopen('http://127.0.0.1:8090' + path, timeout=3)\n        status = getattr(resp, 'status', 200)\n        if 200 <= status < 500:\n            sys.exit(0)\n    except Exception:\n        pass\nsys.exit(1)\nPY"
        ]
      interval: "${OPENLAYER_HEALTH_INTERVAL:-10s}"
      timeout: "${OPENLAYER_HEALTH_TIMEOUT:-5s}"
      retries: ${OPENLAYER_HEALTH_RETRIES:-5}
      start_period: "${OPENLAYER_HEALTH_START_PERIOD:-15s}"

    networks:
      vectoplan-net:
        aliases:
          - openlayer
          - vectoplan-openlayer
      vectoplan-shared:
        aliases:
          - openlayer
          - server-openlayer
      vectoplan:
        aliases:
          - openlayer
          - server-openlayer

volumes:
  vectoplan-language-data:
  vectoplan-library-postgres-data:
  vectoplan-filecloud-postgres-data:
  vectoplan-chunk-postgres-data:
  vectoplan-chunk-terrain-cache:
  vectoplan-lv-postgres-data:
  vectoplan-lv-storage:
  vectoplan-app-postgres-data:
  vectoplan-app-media:
  vectoplan-core-postgres-data:
  vectoplan-core-storage:
networks:
  vectoplan-net:
    driver: bridge

  vectoplan-shared:
    name: "${VECTOPLAN_SHARED_NETWORK:-vectoplan-shared-net}"
    external: true

  vectoplan:
    name: "${VECTOPLAN_SCRAPER_NETWORK:-vectoplan-scraper-network}"
    external: true
