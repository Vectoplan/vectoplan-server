  VECTOPLAN_CHUNK_PROJECT_PROVISIONING_DEFAULT_WORLD_ID: "${VECTOPLAN_CHUNK_PROJECT_PROVISIONING_DEFAULT_WORLD_ID:-world_spawn}"
  VECTOPLAN_CHUNK_PROJECT_PROVISIONING_DEFAULT_TEMPLATE_ID: "${VECTOPLAN_CHUNK_PROJECT_PROVISIONING_DEFAULT_TEMPLATE_ID:-earth}"
