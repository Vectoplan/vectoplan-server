  VECTOPLAN_CHUNK_DB_HOST: "${VECTOPLAN_CHUNK_DB_HOST:-vectoplan-chunk-db}"
  VECTOPLAN_CHUNK_DB_PORT: "${VECTOPLAN_CHUNK_DB_PORT:-5432}"
