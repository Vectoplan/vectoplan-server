  # Diese Werte verwenden absichtlich keine globalen VECTOPLAN_CHUNK_AUTO_* Overrides.
  VECTOPLAN_CHUNK_STARTUP_MODE: "runtime"
  VECTOPLAN_CHUNK_RUNTIME_MODE: "runtime"
  VECTOPLAN_CHUNK_DB_BOOTSTRAP_ENABLED: "false"
  VECTOPLAN_CHUNK_ALLOW_RUNTIME_DB_MUTATIONS: "true"
  VECTOPLAN_CHUNK_RUNTIME_IS_READ_ONLY: "false"
  VECTOPLAN_CHUNK_ALLOW_RUNTIME_SCHEMA_MUTATIONS: "false"
  VECTOPLAN_CHUNK_RUNTIME_SCHEMA_IS_READ_ONLY: "true"
  VECTOPLAN_CHUNK_RUNTIME_BUSINESS_MUTATIONS_ENABLED: "true"
  VECTOPLAN_CHUNK_AUTO_CREATE_ALL: "false"
  VECTOPLAN_CHUNK_AUTO_SEED_DEFAULTS: "false"
  VECTOPLAN_CHUNK_SEED_DEBUG_BLOCKS: "false"
  VECTOPLAN_CHUNK_SEED_DEV_PROJECT: "false"
  VECTOPLAN_CHUNK_DB_BOOTSTRAP_CREATE_ALL: "false"
  VECTOPLAN_CHUNK_DB_BOOTSTRAP_SEED_DEFAULTS: "false"
  VECTOPLAN_CHUNK_DB_BOOTSTRAP_SEED_DEBUG_BLOCKS: "false"
  VECTOPLAN_CHUNK_DB_BOOTSTRAP_SEED_DEV_PROJECT: "false"
  VECTOPLAN_CHUNK_BOOTSTRAP_REPAIR_MISSING_COLUMNS: "false"
  VECTOPLAN_CHUNK_DB_BOOTSTRAP_FAIL_ON_ERROR: "false"
  VECTOPLAN_CHUNK_SEED_ON_EMPTY_ONLY: "true"

  # Eindeutige Welt-Semantik:
  # - world_spawn ist die konkrete editierbare WorldInstance.
  # - flat ist Template/Provider, aber niemals die konkrete Default-World-ID.
  VECTOPLAN_CHUNK_DEFAULT_PROJECT_ID: "${VECTOPLAN_CHUNK_DEFAULT_PROJECT_ID:-dev-project}"
  VECTOPLAN_CHUNK_DEFAULT_UNIVERSE_ID: "${VECTOPLAN_CHUNK_DEFAULT_UNIVERSE_ID:-dev-universe}"
  VECTOPLAN_CHUNK_DEFAULT_WORLD_ID: "${VECTOPLAN_CHUNK_DEFAULT_WORLD_ID:-world_spawn}"
  VECTOPLAN_CHUNK_DEFAULT_INSTANCE_WORLD_ID: "${VECTOPLAN_CHUNK_DEFAULT_INSTANCE_WORLD_ID:-world_spawn}"
  VECTOPLAN_CHUNK_DEFAULT_TEMPLATE_ID: "${VECTOPLAN_CHUNK_DEFAULT_TEMPLATE_ID:-flat}"
  VECTOPLAN_CHUNK_DEFAULT_PROVIDER_WORLD_ID: "${VECTOPLAN_CHUNK_DEFAULT_PROVIDER_WORLD_ID:-flat}"
  VECTOPLAN_CHUNK_DEFAULT_BLOCK_REGISTRY_ID: "${VECTOPLAN_CHUNK_DEFAULT_BLOCK_REGISTRY_ID:-debug-blocks}"
  VECTOPLAN_CHUNK_DEFAULT_BLOCK_REGISTRY_VERSION: "${VECTOPLAN_CHUNK_DEFAULT_BLOCK_REGISTRY_VERSION:-1}"

  # Global/bootstrap default remains Flat. App-project provisioning requests
