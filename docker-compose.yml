  VECTOPLAN_CHUNK_EARTH_SAMPLE_WORLD_ID: "${VECTOPLAN_CHUNK_EARTH_SAMPLE_WORLD_ID:-world_earth_sample}"
  VECTOPLAN_CHUNK_BOOTSTRAP_REPAIR_MISSING_COLUMNS: "${VECTOPLAN_CHUNK_INIT_REPAIR_MISSING_COLUMNS:-true}"
  VECTOPLAN_CHUNK_DB_BOOTSTRAP_FAIL_ON_ERROR: "${VECTOPLAN_CHUNK_INIT_FAIL_ON_ERROR:-true}"
  VECTOPLAN_CHUNK_SEED_ON_EMPTY_ONLY: "${VECTOPLAN_CHUNK_INIT_SEED_ON_EMPTY_ONLY:-false}"

  # Init verwendet dieselben globalen Entwicklungs-IDs wie Runtime. Diese
