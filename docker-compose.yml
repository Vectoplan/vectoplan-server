# services/vectoplan-server/docker-compose.yml

# ------------------------------------------------------------------------------
# VECTOPLAN Server Stack
# ------------------------------------------------------------------------------
#
# Start aus diesem Verzeichnis:
#   docker compose up -d --build
#
# GeoServer und GeoServer-Orchestrator werden vom BigData-Stack unter
# ../vectoplan-bigdata betrieben. Dieser Stack greift über das gemeinsame
# Netzwerk vectoplan-scraper-network darauf zu. Bei einem Gesamtstart startet
# start.py deshalb BigData-Geo vor diesem Server-Stack.
#
# Wichtige Regel für diesen Stack:
# - *_INTERNAL_URL ist nur für Container-zu-Container-Kommunikation.
# - *_PUBLIC_URL ist für Browser, iframe, Redirects und "extern öffnen".
#
# Architekturentscheidung für vectoplan-chunk:
# - vectoplan-chunk-db hält die PostgreSQL-Datenbank.
# - vectoplan-chunk-init führt ausschließlich Schema-Bootstrap, Migration/Repair
#   und optionale globale Entwicklungs-Seeds aus.
# - vectoplan-chunk startet danach ohne Schema- oder Seed-Mutationen.
# - Die Runtime darf weiterhin autorisierte fachliche Mutationen ausführen:
#   Projekt-Provisionierung, Access-Projektion, Commands, Blocks und Chunks.
#
# Warum:
# - db.create_all(), Schema-Repair und Default-Seeding dürfen nicht im normalen
#   Gunicorn-Worker-Startup laufen.
# - Runtime-Startup bleibt stabil und erzeugt keine Tabellen.
# - Fachliche API-Mutationen werden getrennt von Schema-Mutationen autorisiert.
#
# App-zu-Chunk-Vertrag:
# - vectoplan-app persistiert das App-Projekt zuerst.
# - Danach provisioniert vectoplan-app idempotent ein Chunk-Projekt mit
#   Universe/World über VECTOPLAN_CHUNK_INTERNAL_URL.
# - App-Projekte fordern standardmäßig Earth an; Flat ist nur ein kontrollierter
#   Fallback für bekannte Earth-Referenz-/Precondition-Fehler.
# - vectoplan-app ist die Wahrheit für Projektrollen und synchronisiert
#   owner/admin/editor/viewer als direkte Access-Projektion zu vectoplan-chunk.
# - vectoplan-app speichert nur Chunk-Referenzen und Synchronisationszustände.
#
# Browser-Regel:
# - Browser / iframe / redirect  → PUBLIC_URL
# - Backend / server-to-server   → INTERNAL_URL

name: ${VECTOPLAN_SERVER_PROJECT_NAME:-vectoplan-server}

x-vectoplan-logging: &vectoplan-logging
  driver: json-file
  options:
    max-size: "${VECTOPLAN_LOG_MAX_SIZE:-10m}"
    max-file: "${VECTOPLAN_LOG_MAX_FILE:-3}"

x-vectoplan-python-environment: &vectoplan-python-environment
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  TZ: "${TZ:-Europe/Berlin}"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  APP_I18N_TRANSFORM_HTML: "${APP_I18N_TRANSFORM_HTML:-true}"
  APP_I18N_LIVE_TRANSLATE: "${APP_I18N_LIVE_TRANSLATE:-true}"
  APP_I18N_SOURCE_LANG: "${APP_I18N_SOURCE_LANG:-de}"
  APP_I18N_LIVE_BATCH_CHARS: "${APP_I18N_LIVE_BATCH_CHARS:-8000}"
  APP_DEFAULT_LANG: "${APP_DEFAULT_LANG:-de}"
  APP_LANGS: "${APP_LANGS:-en,de}"
  APP_LANG_COOKIE_NAME: "${APP_LANG_COOKIE_NAME:-vectoplan_language}"
  TR_SVC_BASE_URL: "${TR_SVC_BASE_URL:-http://vectoplan-language:8000}"
  TR_SVC_TIMEOUT_SEC: "${TR_SVC_TIMEOUT_SEC:-15}"

x-vectoplan-service-defaults: &vectoplan-service-defaults
  init: true
  restart: unless-stopped
  logging: *vectoplan-logging
  stop_signal: SIGTERM
  stop_grace_period: 30s

x-vectoplan-init-service-defaults: &vectoplan-init-service-defaults
  init: true
  restart: "no"
  logging: *vectoplan-logging
  stop_signal: SIGTERM
  stop_grace_period: 30s

x-vectoplan-library-postgres-environment: &vectoplan-library-postgres-environment
  POSTGRES_DB: "${VECTOPLAN_LIBRARY_POSTGRES_DB:-vectoplan_library}"
  POSTGRES_USER: "${VECTOPLAN_LIBRARY_POSTGRES_USER:-vectoplan}"
  POSTGRES_PASSWORD: "${VECTOPLAN_LIBRARY_POSTGRES_PASSWORD:-vectoplan}"
  PGDATA: "/var/lib/postgresql/data/pgdata"

x-vectoplan-chunk-postgres-environment: &vectoplan-chunk-postgres-environment
  POSTGRES_DB: "${VECTOPLAN_CHUNK_POSTGRES_DB:-vectoplan_chunk}"
  POSTGRES_USER: "${VECTOPLAN_CHUNK_POSTGRES_USER:-vectoplan_chunk}"
  POSTGRES_PASSWORD: "${VECTOPLAN_CHUNK_POSTGRES_PASSWORD:-vectoplan_chunk}"
  PGDATA: "/var/lib/postgresql/data/pgdata"

x-vectoplan-lv-postgres-environment: &vectoplan-lv-postgres-environment
  POSTGRES_DB: "${VECTOPLAN_LV_POSTGRES_DB:-vectoplan_lv}"
  POSTGRES_USER: "${VECTOPLAN_LV_POSTGRES_USER:-vectoplan_lv}"
  POSTGRES_PASSWORD: "${VECTOPLAN_LV_POSTGRES_PASSWORD:-vectoplan_lv}"
  PGDATA: "/var/lib/postgresql/data/pgdata"

x-vectoplan-app-postgres-environment: &vectoplan-app-postgres-environment
  POSTGRES_DB: "${VECTOPLAN_APP_POSTGRES_DB:-vectoplan_app}"
  POSTGRES_USER: "${VECTOPLAN_APP_POSTGRES_USER:-vectoplan_app}"
  POSTGRES_PASSWORD: "${VECTOPLAN_APP_POSTGRES_PASSWORD:-vectoplan_app}"
  PGDATA: "/var/lib/postgresql/data/pgdata"

x-vectoplan-core-postgres-environment: &vectoplan-core-postgres-environment
  POSTGRES_DB: "${VECTOPLAN_CORE_POSTGRES_DB:-vectoplan_core}"
  POSTGRES_USER: "${VECTOPLAN_CORE_POSTGRES_USER:-vectoplan_core}"
  POSTGRES_PASSWORD: "${VECTOPLAN_CORE_POSTGRES_PASSWORD:-vectoplan_core}"
  PGDATA: "/var/lib/postgresql/data/pgdata"

x-vectoplan-filecloud-postgres-environment: &vectoplan-filecloud-postgres-environment
  POSTGRES_DB: "${VECTOPLAN_FILECLOUD_POSTGRES_DB:-vectoplan_filecloud}"
  POSTGRES_USER: "${VECTOPLAN_FILECLOUD_POSTGRES_USER:-vectoplan_filecloud}"
  POSTGRES_PASSWORD: "${VECTOPLAN_FILECLOUD_POSTGRES_PASSWORD:-vectoplan_filecloud}"
  PGDATA: "/var/lib/postgresql/data/pgdata"

x-vectoplan-filecloud-environment: &vectoplan-filecloud-environment
  <<: *vectoplan-python-environment

  SERVICE_NAME: "vectoplan-filecloud"
  APP_NAME: "vectoplan-filecloud"
  VECTOPLAN_SERVICE_NAME: "vectoplan-filecloud"

  VECTOPLAN_FILECLOUD_CONFIG: "${VECTOPLAN_FILECLOUD_CONFIG:-production}"
  VECTOPLAN_FILECLOUD_DATABASE_URL: "${VECTOPLAN_FILECLOUD_DATABASE_URL:-postgresql+psycopg://vectoplan_filecloud:vectoplan_filecloud@vectoplan-filecloud-db:5432/vectoplan_filecloud}"
  VECTOPLAN_FILECLOUD_AUTO_CREATE_SCHEMA: "${VECTOPLAN_FILECLOUD_AUTO_CREATE_SCHEMA:-true}"
  VECTOPLAN_FILECLOUD_MAX_UPLOAD_BYTES: "${VECTOPLAN_FILECLOUD_MAX_UPLOAD_BYTES:-104857600}"
  VECTOPLAN_FILECLOUD_ORCHESTRATOR_API_KEY: "${VECTOPLAN_FILECLOUD_ORCHESTRATOR_API_KEY:-}"
  VECTOPLAN_FILECLOUD_PUBLIC_URL: "${VECTOPLAN_FILECLOUD_PUBLIC_URL:-http://localhost:5107}"
  VECTOPLAN_FILECLOUD_WEBDAV_ENABLED: "${VECTOPLAN_FILECLOUD_WEBDAV_ENABLED:-true}"
  VECTOPLAN_FILECLOUD_AUTH_REQUIRED: "${VECTOPLAN_FILECLOUD_AUTH_REQUIRED:-true}"
  VECTOPLAN_FILECLOUD_PROJECT_ACCESS_REQUIRED: "${VECTOPLAN_FILECLOUD_PROJECT_ACCESS_REQUIRED:-true}"
  VECTOPLAN_AUTH_BASE_URL: "${VECTOPLAN_FILECLOUD_AUTH_BASE_URL:-http://host.docker.internal:5000}"
  VECTOPLAN_AUTH_PUBLIC_URL: "${VECTOPLAN_FILECLOUD_AUTH_PUBLIC_URL:-http://127.0.0.1:5000}"
  VECTOPLAN_AUTH_REQUEST_TIMEOUT_SECONDS: "${VECTOPLAN_FILECLOUD_AUTH_TIMEOUT_SECONDS:-5}"
  VECTOPLAN_AUTH_VERIFY_TLS: "${VECTOPLAN_FILECLOUD_AUTH_VERIFY_TLS:-true}"
  VECTOPLAN_AUTH_SERVICE_NAME: "${VECTOPLAN_FILECLOUD_AUTH_SERVICE_NAME:-vectoplan-filecloud}"
  VECTOPLAN_FILECLOUD_REQUIRED_ENTITLEMENT: "${VECTOPLAN_FILECLOUD_REQUIRED_ENTITLEMENT:-cloud_access}"
  VECTOPLAN_FILECLOUD_ACCESS_TICKET_SECRET: "${VECTOPLAN_FILECLOUD_ACCESS_TICKET_SECRET:-dev-vectoplan-filecloud-access-ticket-secret-change-me}"
  VECTOPLAN_FILECLOUD_ACCESS_SESSION_TTL_SECONDS: "${VECTOPLAN_FILECLOUD_ACCESS_SESSION_TTL_SECONDS:-28800}"
  VECTOPLAN_APP_BASE_URL: "${VECTOPLAN_FILECLOUD_APP_BASE_URL:-http://vectoplan-app:8000}"
  VECTOPLAN_APP_REQUEST_TIMEOUT_SECONDS: "${VECTOPLAN_FILECLOUD_APP_TIMEOUT_SECONDS:-5}"
  VECTOPLAN_APP_VERIFY_TLS: "${VECTOPLAN_FILECLOUD_APP_VERIFY_TLS:-true}"
  VECTOPLAN_LV_BASE_URL: "${VECTOPLAN_FILECLOUD_LV_BASE_URL:-http://vectoplan-lv:5000}"
  VECTOPLAN_LV_REQUEST_TIMEOUT_SECONDS: "${VECTOPLAN_FILECLOUD_LV_TIMEOUT_SECONDS:-8}"
  VECTOPLAN_LV_VERIFY_TLS: "${VECTOPLAN_FILECLOUD_LV_VERIFY_TLS:-true}"
  VECTOPLAN_FILECLOUD_FRAME_ANCESTORS: "${VECTOPLAN_FILECLOUD_FRAME_ANCESTORS:-'self' http://localhost:5103 http://127.0.0.1:5103 http://localhost:5200 http://127.0.0.1:5200 http://localhost:5203 http://127.0.0.1:5203}"
  VECTOPLAN_FILECLOUD_VERGABE_API_URL: "${VECTOPLAN_FILECLOUD_VERGABE_API_URL:-http://platform-vergabe:8000/vergabe}"
  VECTOPLAN_FILECLOUD_ARCHIVE_API_URL: "${VECTOPLAN_FILECLOUD_ARCHIVE_API_URL:-http://host.docker.internal:5109/datensammlung}"
  VECTOPLAN_FILECLOUD_BOOTSTRAP_DEVELOPMENT_DEFAULTS: "${VECTOPLAN_FILECLOUD_BOOTSTRAP_DEVELOPMENT_DEFAULTS:-false}"

x-vectoplan-editor-environment: &vectoplan-editor-environment
  <<: *vectoplan-python-environment

  SERVICE_NAME: "vectoplan-editor"
  APP_NAME: "vectoplan-editor"
  APP_HOME: "/opt/vectoplan/services/vectoplan-editor"
  VECTOPLAN_SERVICE_NAME: "vectoplan-editor"

  VECTOPLAN_EDITOR_CONFIG: "${VECTOPLAN_EDITOR_CONFIG:-development}"
  VECTOPLAN_EDITOR_DEBUG: "${VECTOPLAN_EDITOR_DEBUG:-true}"
  VECTOPLAN_EDITOR_HOST: "0.0.0.0"
  VECTOPLAN_EDITOR_PORT: "5000"

  VECTOPLAN_EDITOR_PUBLIC_URL: "${VECTOPLAN_EDITOR_PUBLIC_URL:-http://localhost:5100}"
  VECTOPLAN_EDITOR_PUBLIC_BASE_URL: "${VECTOPLAN_EDITOR_PUBLIC_BASE_URL:-http://localhost:5100}"
  VECTOPLAN_EDITOR_ROUTE: "${VECTOPLAN_EDITOR_ROUTE:-/editor}"
  VECTOPLAN_EDITOR_EMBED_ENABLED: "${VECTOPLAN_EDITOR_EMBED_ENABLED:-true}"
  VECTOPLAN_EDITOR_FRAME_ANCESTORS: "http://localhost:5103 http://127.0.0.1:5103 http://localhost:5101 http://127.0.0.1:5101 http://localhost:5200 http://127.0.0.1:5200 http://localhost:5108 http://127.0.0.1:5108 http://localhost:5097 http://127.0.0.1:5097"
  VECTOPLAN_ALLOWED_FRAME_PARENTS: "http://localhost:5103 http://127.0.0.1:5103 http://localhost:5101 http://127.0.0.1:5101 http://localhost:5200 http://127.0.0.1:5200 http://localhost:5108 http://127.0.0.1:5108 http://localhost:5097 http://127.0.0.1:5097"
  VECTOPLAN_APP_PUBLIC_URL: "${VECTOPLAN_APP_PUBLIC_URL:-http://localhost:5103}"
  VECTOPLAN_EDITOR_ACCESS_TICKET_SECRET: "${VECTOPLAN_EDITOR_ACCESS_TICKET_SECRET:-dev-vectoplan-editor-access-ticket-secret-change-me}"
  VECTOPLAN_EDITOR_ACCESS_TICKET_TTL_SECONDS: "${VECTOPLAN_EDITOR_ACCESS_TICKET_TTL_SECONDS:-300}"
  VECTOPLAN_EDITOR_ACCESS_SESSION_TTL_SECONDS: "${VECTOPLAN_EDITOR_ACCESS_SESSION_TTL_SECONDS:-28800}"
  VECTOPLAN_EDITOR_ACCESS_COOKIE_SECURE: "${VECTOPLAN_EDITOR_ACCESS_COOKIE_SECURE:-false}"



  VECTOPLAN_EDITOR_STARTUP_MODULE: "${VECTOPLAN_EDITOR_STARTUP_MODULE:-src.bootstrap.startup}"
  VECTOPLAN_EDITOR_PRESTART_CHECK: "${VECTOPLAN_EDITOR_PRESTART_CHECK:-true}"
  VECTOPLAN_EDITOR_PRINT_STARTUP_SUMMARY: "${VECTOPLAN_EDITOR_PRINT_STARTUP_SUMMARY:-true}"
  VECTOPLAN_EDITOR_STARTUP_STRICT: "${VECTOPLAN_EDITOR_STARTUP_STRICT:-false}"
  VECTOPLAN_EDITOR_STRICT_ASSET_CHECKS: "${VECTOPLAN_EDITOR_STRICT_ASSET_CHECKS:-false}"

  VECTOPLAN_EDITOR_FRONTEND_BUILD_REQUIRED: "${VECTOPLAN_EDITOR_FRONTEND_BUILD_REQUIRED:-true}"
  VECTOPLAN_EDITOR_FRONTEND_STRICT_CHECKS: "${VECTOPLAN_EDITOR_FRONTEND_STRICT_CHECKS:-true}"
  VECTOPLAN_EDITOR_FRONTEND_SOURCE_CHECKS: "${VECTOPLAN_EDITOR_FRONTEND_SOURCE_CHECKS:-false}"
  VECTOPLAN_EDITOR_STATIC_EDITOR_DIR: "${VECTOPLAN_EDITOR_STATIC_EDITOR_DIR:-./static/editor}"
  VECTOPLAN_EDITOR_STATIC_MANIFEST_NAME: "${VECTOPLAN_EDITOR_STATIC_MANIFEST_NAME:-manifest.json}"
  VECTOPLAN_EDITOR_FRONTEND_EXPECTED_ENTRY: "${VECTOPLAN_EDITOR_FRONTEND_EXPECTED_ENTRY:-./static/editor/manifest.json}"

  VECTOPLAN_EDITOR_WORLD_MODE: "${VECTOPLAN_EDITOR_WORLD_MODE:-chunk_service}"
  VECTOPLAN_EDITOR_WORLD_SOURCE_KIND: "${VECTOPLAN_EDITOR_WORLD_SOURCE_KIND:-chunk-service}"

  VECTOPLAN_EDITOR_LIBRARY_SERVICE_INTERNAL_URL: "${VECTOPLAN_EDITOR_LIBRARY_SERVICE_INTERNAL_URL:-http://vectoplan-library:5000}"
  VECTOPLAN_EDITOR_CAD_SERVICE_INTERNAL_URL: "${VECTOPLAN_EDITOR_CAD_SERVICE_INTERNAL_URL:-http://vectoplan-cad:5000}"
  VECTOPLAN_EDITOR_CHUNK_SERVICE_INTERNAL_URL: "${VECTOPLAN_EDITOR_CHUNK_SERVICE_INTERNAL_URL:-http://vectoplan-chunk:5000}"

  # Editor -> Chunk uses a service identity. Browser identities are never used
  # as service credentials and are not appended to URLs.
  VECTOPLAN_EDITOR_CHUNK_SERVICE_ID: "${VECTOPLAN_EDITOR_CHUNK_SERVICE_ID:-vectoplan-editor}"
  VECTOPLAN_EDITOR_CHUNK_SERVICE_API_KEY: "${VECTOPLAN_CHUNK_SERVICE_API_KEY:-dev-vectoplan-chunk-service-key-change-me}"
  VECTOPLAN_EDITOR_CHUNK_INTERNAL_TOKEN: "${VECTOPLAN_CHUNK_SERVICE_API_KEY:-dev-vectoplan-chunk-service-key-change-me}"
  VECTOPLAN_EDITOR_REALTIME_INTERNAL_TOKEN: "${VECTOPLAN_CHUNK_SERVICE_API_KEY:-dev-vectoplan-chunk-service-key-change-me}"
  VECTOPLAN_AUTH_INTERNAL_URL: "${VECTOPLAN_AUTH_INTERNAL_URL:-http://host.docker.internal:5000}"

  VECTOPLAN_EDITOR_CHUNK_ENABLED: "${VECTOPLAN_EDITOR_CHUNK_ENABLED:-true}"
  VECTOPLAN_EDITOR_CHUNK_MODE: "${VECTOPLAN_EDITOR_CHUNK_MODE:-remote}"
  VECTOPLAN_EDITOR_CHUNK_SOURCE_KIND: "${VECTOPLAN_EDITOR_CHUNK_SOURCE_KIND:-chunk-service}"
  VECTOPLAN_EDITOR_CHUNK_API_PREFIX: "${VECTOPLAN_EDITOR_CHUNK_API_PREFIX:-/editor/api/chunk}"
  VECTOPLAN_EDITOR_CHUNK_BROWSER_BASE_URL: "${VECTOPLAN_EDITOR_CHUNK_BROWSER_BASE_URL:-/editor/api/chunk}"

  VECTOPLAN_EDITOR_DEFAULT_PROJECT_ID: "${VECTOPLAN_EDITOR_DEFAULT_PROJECT_ID:-dev-project}"
  VECTOPLAN_EDITOR_CHUNK_SERVICE_WORLD_ID: "${VECTOPLAN_EDITOR_CHUNK_SERVICE_WORLD_ID:-world_earth_sample}"
  VECTOPLAN_EDITOR_DEFAULT_WORLD_ID: "${VECTOPLAN_EDITOR_DEFAULT_WORLD_ID:-world_earth_sample}"
  VECTOPLAN_EDITOR_CHUNK_DEFAULT_PROJECT_ID: "${VECTOPLAN_EDITOR_CHUNK_DEFAULT_PROJECT_ID:-dev-project}"
  VECTOPLAN_EDITOR_CHUNK_DEFAULT_WORLD_ID: "${VECTOPLAN_EDITOR_CHUNK_DEFAULT_WORLD_ID:-world_earth_sample}"

  # A cold Earth chunk may need to resolve referenced DGM tiles before its
  # release-keyed cache exists. Warm requests remain fast.
  VECTOPLAN_EDITOR_CHUNK_REQUEST_TIMEOUT: "${VECTOPLAN_EDITOR_CHUNK_REQUEST_TIMEOUT:-30}"
  VECTOPLAN_EDITOR_CHUNK_COMMAND_TIMEOUT: "${VECTOPLAN_EDITOR_CHUNK_COMMAND_TIMEOUT:-15}"
  VECTOPLAN_EDITOR_CHUNK_BATCH_TIMEOUT: "${VECTOPLAN_EDITOR_CHUNK_BATCH_TIMEOUT:-60}"
  VECTOPLAN_EDITOR_CHUNK_STATUS_TIMEOUT: "${VECTOPLAN_EDITOR_CHUNK_STATUS_TIMEOUT:-10}"
  VECTOPLAN_EDITOR_CHUNK_SERVICE_REQUEST_TIMEOUT_MS: "${VECTOPLAN_EDITOR_CHUNK_SERVICE_REQUEST_TIMEOUT_MS:-45000}"
  VECTOPLAN_EDITOR_CHUNK_SERVICE_COMMAND_TIMEOUT_MS: "${VECTOPLAN_EDITOR_CHUNK_SERVICE_COMMAND_TIMEOUT_MS:-15000}"
  VECTOPLAN_EDITOR_CHUNK_SERVICE_BATCH_TIMEOUT_MS: "${VECTOPLAN_EDITOR_CHUNK_SERVICE_BATCH_TIMEOUT_MS:-60000}"
  VECTOPLAN_EDITOR_CHUNK_SERVICE_STATUS_TIMEOUT_MS: "${VECTOPLAN_EDITOR_CHUNK_SERVICE_STATUS_TIMEOUT_MS:-10000}"
  VECTOPLAN_EDITOR_CHUNK_MAX_RESPONSE_BYTES: "${VECTOPLAN_EDITOR_CHUNK_MAX_RESPONSE_BYTES:-20971520}"
  VECTOPLAN_EDITOR_CHUNK_STATUS_PATHS: "${VECTOPLAN_EDITOR_CHUNK_STATUS_PATHS:-/health/ready,/}"
  VECTOPLAN_EDITOR_CHUNK_PROXY_DIAGNOSTICS_ENABLED: "${VECTOPLAN_EDITOR_CHUNK_PROXY_DIAGNOSTICS_ENABLED:-true}"
  VECTOPLAN_EDITOR_CHUNK_PROXY_ALLOW_PROJECT_MUTATIONS: "${VECTOPLAN_EDITOR_CHUNK_PROXY_ALLOW_PROJECT_MUTATIONS:-true}"
  VECTOPLAN_EDITOR_CHUNK_PROXY_ALLOW_WORLD_MUTATIONS: "${VECTOPLAN_EDITOR_CHUNK_PROXY_ALLOW_WORLD_MUTATIONS:-true}"
  VECTOPLAN_EDITOR_CHUNK_PROXY_ENFORCE_PROJECT_ACCESS: "${VECTOPLAN_EDITOR_CHUNK_PROXY_ENFORCE_PROJECT_ACCESS:-true}"
  VECTOPLAN_EDITOR_CHUNK_PROXY_REQUIRE_CANONICAL_AUTH_USER_ID: "${VECTOPLAN_EDITOR_CHUNK_PROXY_REQUIRE_CANONICAL_AUTH_USER_ID:-true}"
  VECTOPLAN_EDITOR_CHUNK_PROXY_VIEWER_READ_ONLY: "${VECTOPLAN_EDITOR_CHUNK_PROXY_VIEWER_READ_ONLY:-true}"
  VECTOPLAN_EDITOR_CHUNK_PROXY_PUBLIC_VIEWER_READ_ONLY: "${VECTOPLAN_EDITOR_CHUNK_PROXY_PUBLIC_VIEWER_READ_ONLY:-true}"
  VECTOPLAN_EDITOR_CHUNK_PROXY_ALLOW_VIEWER_COMMANDS: "${VECTOPLAN_EDITOR_CHUNK_PROXY_ALLOW_VIEWER_COMMANDS:-false}"
  VECTOPLAN_EDITOR_CHUNK_PROXY_ALLOW_PUBLIC_VIEWER_COMMANDS: "${VECTOPLAN_EDITOR_CHUNK_PROXY_ALLOW_PUBLIC_VIEWER_COMMANDS:-false}"
  VECTOPLAN_EDITOR_CHUNK_PROXY_ALLOW_CLIENT_IDENTITY_OVERRIDE: "${VECTOPLAN_EDITOR_CHUNK_PROXY_ALLOW_CLIENT_IDENTITY_OVERRIDE:-false}"
  VECTOPLAN_EDITOR_ALLOW_DEFAULT_PROJECT_FALLBACK: "${VECTOPLAN_EDITOR_ALLOW_DEFAULT_PROJECT_FALLBACK:-false}"
  VECTOPLAN_EDITOR_ALLOW_DEFAULT_WORLD_FALLBACK: "${VECTOPLAN_EDITOR_ALLOW_DEFAULT_WORLD_FALLBACK:-false}"
  VECTOPLAN_EDITOR_PUBLIC_VIEWER_EMBED_ENABLED: "${VECTOPLAN_EDITOR_PUBLIC_VIEWER_EMBED_ENABLED:-true}"

  VECTOPLAN_EDITOR_INVENTORY_SOURCE: "${VECTOPLAN_EDITOR_INVENTORY_SOURCE:-editor-inventory}"
  VECTOPLAN_EDITOR_INVENTORY_ICON_MODE: "${VECTOPLAN_EDITOR_INVENTORY_ICON_MODE:-icon-only}"
  VECTOPLAN_EDITOR_INVENTORY_HOTBAR_SIZE: "${VECTOPLAN_EDITOR_INVENTORY_HOTBAR_SIZE:-9}"
  VECTOPLAN_EDITOR_INVENTORY_DEFAULT_SELECTED_SLOT: "${VECTOPLAN_EDITOR_INVENTORY_DEFAULT_SELECTED_SLOT:-0}"
  VECTOPLAN_EDITOR_INVENTORY_SCROLL_WRAP: "${VECTOPLAN_EDITOR_INVENTORY_SCROLL_WRAP:-true}"
  VECTOPLAN_EDITOR_INVENTORY_ALLOW_PLACE_ACTION: "${VECTOPLAN_EDITOR_INVENTORY_ALLOW_PLACE_ACTION:-true}"
  VECTOPLAN_EDITOR_INVENTORY_ALLOW_BREAK_ACTION: "${VECTOPLAN_EDITOR_INVENTORY_ALLOW_BREAK_ACTION:-true}"

  VECTOPLAN_EDITOR_CHUNKS_ENABLED: "${VECTOPLAN_EDITOR_CHUNKS_ENABLED:-true}"
  VECTOPLAN_EDITOR_CHUNKS_EMPTY_WORLD: "${VECTOPLAN_EDITOR_CHUNKS_EMPTY_WORLD:-false}"
  VECTOPLAN_EDITOR_CHUNKS_CHUNK_SIZE: "${VECTOPLAN_EDITOR_CHUNKS_CHUNK_SIZE:-16}"
  VECTOPLAN_EDITOR_CHUNKS_VIEW_DISTANCE: "${VECTOPLAN_EDITOR_CHUNKS_VIEW_DISTANCE:-14}"
  VECTOPLAN_EDITOR_CHUNKS_PRELOAD_RADIUS: "${VECTOPLAN_EDITOR_CHUNKS_PRELOAD_RADIUS:-2}"
  VECTOPLAN_EDITOR_CHUNKS_UNLOAD_DISTANCE: "${VECTOPLAN_EDITOR_CHUNKS_UNLOAD_DISTANCE:-19}"
  VECTOPLAN_EDITOR_CHUNKS_MAX_LOADED_CHUNKS: "${VECTOPLAN_EDITOR_CHUNKS_MAX_LOADED_CHUNKS:-2048}"
  VECTOPLAN_EDITOR_CHUNK_SERVICE_MAX_BATCH_CHUNKS: "${VECTOPLAN_EDITOR_CHUNK_SERVICE_MAX_BATCH_CHUNKS:-256}"
  VECTOPLAN_EDITOR_CHUNKS_LOAD_AROUND_PLAYER: "${VECTOPLAN_EDITOR_CHUNKS_LOAD_AROUND_PLAYER:-true}"
  VECTOPLAN_EDITOR_CHUNKS_DEBUG_DRAW_CHUNK_BOUNDS: "${VECTOPLAN_EDITOR_CHUNKS_DEBUG_DRAW_CHUNK_BOUNDS:-false}"
  VECTOPLAN_EDITOR_CHUNKS_PREFER_BATCH_LOAD: "${VECTOPLAN_EDITOR_CHUNKS_PREFER_BATCH_LOAD:-true}"
  VECTOPLAN_EDITOR_CHUNKS_RELOAD_DIRTY_AFTER_COMMAND: "${VECTOPLAN_EDITOR_CHUNKS_RELOAD_DIRTY_AFTER_COMMAND:-true}"

  IDENTITY_INTERNAL_URL: "${IDENTITY_INTERNAL_URL:-http://identity:9000}"
  REGISTRY_INTERNAL_URL: "${REGISTRY_INTERNAL_URL:-http://registry:8000}"

  VECTOPLAN_EDITOR_RUN_MODE: "${VECTOPLAN_EDITOR_RUN_MODE:-gunicorn}"
  GUNICORN_APP: "${VECTOPLAN_EDITOR_GUNICORN_APP:-wsgi:app}"
