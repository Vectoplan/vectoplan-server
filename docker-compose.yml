  VECTOPLAN_CHUNK_DB_USER: "${VECTOPLAN_CHUNK_DB_USER:-vectoplan_chunk}"
  VECTOPLAN_CHUNK_DB_PASSWORD: "${VECTOPLAN_CHUNK_DB_PASSWORD:-vectoplan_chunk}"
  VECTOPLAN_CHUNK_DATABASE_URI: "${VECTOPLAN_CHUNK_DATABASE_URI:-postgresql+psycopg://vectoplan_chunk:vectoplan_chunk@vectoplan-chunk-db:5432/vectoplan_chunk}"
  VECTOPLAN_CHUNK_DATABASE_URL: "${VECTOPLAN_CHUNK_DATABASE_URL:-postgresql+psycopg://vectoplan_chunk:vectoplan_chunk@vectoplan-chunk-db:5432/vectoplan_chunk}"
  VECTOPLAN_CHUNK_SQLALCHEMY_DATABASE_URI: "${VECTOPLAN_CHUNK_SQLALCHEMY_DATABASE_URI:-postgresql+psycopg://vectoplan_chunk:vectoplan_chunk@vectoplan-chunk-db:5432/vectoplan_chunk}"
  SQLALCHEMY_DATABASE_URI: "${VECTOPLAN_CHUNK_SQLALCHEMY_DATABASE_URI:-postgresql+psycopg://vectoplan_chunk:vectoplan_chunk@vectoplan-chunk-db:5432/vectoplan_chunk}"
  DATABASE_URL: "${VECTOPLAN_CHUNK_DATABASE_URL:-postgresql+psycopg://vectoplan_chunk:vectoplan_chunk@vectoplan-chunk-db:5432/vectoplan_chunk}"

  # Runtime führt keine Schema-/Seed-Mutationen aus. Autorisierte fachliche
