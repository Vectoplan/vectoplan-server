  <<: *vectoplan-python-environment

  SERVICE_NAME: "vectoplan-app"
  APP_NAME: "vectoplan-app"
  APP_HOME: "/app"

  FLASK_ENV: "${VECTOPLAN_APP_FLASK_ENV:-development}"
  HOST: "0.0.0.0"
  PORT: "${VECTOPLAN_APP_INTERNAL_PORT:-8000}"
  MEDIA_ROOT: "${VECTOPLAN_APP_MEDIA_ROOT:-/app/media}"
  SECRET_KEY: "${VECTOPLAN_APP_SECRET_KEY:-dev-vectoplan-app-secret-change-me}"

  VECTOPLAN_APP_PUBLIC_URL: "${VECTOPLAN_APP_PUBLIC_URL:-http://localhost:5103}"
  VECTOPLAN_EDITOR_ACCESS_TICKET_SECRET: "${VECTOPLAN_EDITOR_ACCESS_TICKET_SECRET:-dev-vectoplan-editor-access-ticket-secret-change-me}"
  VECTOPLAN_EDITOR_ACCESS_TICKET_TTL_SECONDS: "${VECTOPLAN_EDITOR_ACCESS_TICKET_TTL_SECONDS:-300}"

  VECTOPLAN_APP_PUBLIC_BASE_URL: "${VECTOPLAN_APP_PUBLIC_BASE_URL:-http://localhost:5103}"

  VECTOPLAN_APP_ALLOWED_FRAME_SRC: "${VECTOPLAN_APP_ALLOWED_FRAME_SRC:-self http://localhost:5100 http://127.0.0.1:5100 http://localhost:5104 http://127.0.0.1:5104 http://localhost:5105 http://127.0.0.1:5105 http://localhost:5190 http://127.0.0.1:5190}"
  VECTOPLAN_ALLOWED_FRAME_PARENTS: "http://localhost:5103 http://127.0.0.1:5103 http://localhost:5200 http://127.0.0.1:5200"
  VECTOPLAN_EDITOR_FRAME_ANCESTORS: "http://localhost:5103 http://127.0.0.1:5103 http://localhost:5200 http://127.0.0.1:5200"
  APP_FRAME_ANCESTORS: "'self' http://localhost:5103 http://127.0.0.1:5103 http://localhost:5200 http://127.0.0.1:5200"

  VECTOPLAN_APP_POSTGRES_DB: "${VECTOPLAN_APP_POSTGRES_DB:-vectoplan_app}"
  VECTOPLAN_APP_POSTGRES_USER: "${VECTOPLAN_APP_POSTGRES_USER:-vectoplan_app}"
  VECTOPLAN_APP_POSTGRES_PASSWORD: "${VECTOPLAN_APP_POSTGRES_PASSWORD:-vectoplan_app}"
  VECTOPLAN_APP_DB_HOST: "${VECTOPLAN_APP_DB_HOST:-vectoplan-app-db}"
  VECTOPLAN_APP_DB_PORT: "${VECTOPLAN_APP_DB_PORT:-5432}"
  VECTOPLAN_APP_DB_NAME: "${VECTOPLAN_APP_DB_NAME:-vectoplan_app}"
  VECTOPLAN_APP_DB_USER: "${VECTOPLAN_APP_DB_USER:-vectoplan_app}"
  VECTOPLAN_APP_DB_PASSWORD: "${VECTOPLAN_APP_DB_PASSWORD:-vectoplan_app}"

  DATABASE_URL: "${VECTOPLAN_APP_DATABASE_URL:-postgresql+psycopg://vectoplan_app:vectoplan_app@vectoplan-app-db:5432/vectoplan_app}"
  SQLALCHEMY_DATABASE_URI: "${VECTOPLAN_APP_DATABASE_URL:-postgresql+psycopg://vectoplan_app:vectoplan_app@vectoplan-app-db:5432/vectoplan_app}"

  IDENTITY_INTERNAL_URL: "${IDENTITY_INTERNAL_URL:-http://identity:9000}"
  REGISTRY_INTERNAL_URL: "${REGISTRY_INTERNAL_URL:-http://registry:8000}"

  VECTOPLAN_AUTH_INTERNAL_URL: "${VECTOPLAN_AUTH_INTERNAL_URL:-http://host.docker.internal:5000}"
  VECTOPLAN_AUTH_BASE_URL: "${VECTOPLAN_AUTH_BASE_URL:-http://host.docker.internal:5000}"
  AUTH_IDENTITY_INTERNAL_URL: "${AUTH_IDENTITY_INTERNAL_URL:-http://host.docker.internal:5000}"
  VECTOPLAN_AUTH_PUBLIC_URL: "${VECTOPLAN_AUTH_PUBLIC_URL:-http://127.0.0.1:5000}"
  VECTOPLAN_AUTH_SERVICE_NAME: "${VECTOPLAN_AUTH_SERVICE_NAME:-vectoplan-auth}"
  VECTOPLAN_AUTH_TRUSTED_GATEWAY_SECRET: "${VECTOPLAN_AUTH_TRUSTED_GATEWAY_SECRET:-dev-vectoplan-auth-gateway-secret-change-me}"

  VECTOPLAN_EDITOR_PUBLIC_URL: "${VECTOPLAN_EDITOR_PUBLIC_URL:-http://localhost:5100}"
  VECTOPLAN_EDITOR_PUBLIC_BASE_URL: "${VECTOPLAN_EDITOR_PUBLIC_BASE_URL:-http://localhost:5100}"
  VECTOPLAN_EDITOR_INTERNAL_URL: "${VECTOPLAN_EDITOR_INTERNAL_URL:-http://vectoplan-editor:5000}"
  VECTOPLAN_EDITOR_ROUTE: "${VECTOPLAN_EDITOR_ROUTE:-/editor}"
  VECTOPLAN_EDITOR_EMBED_ENABLED: "${VECTOPLAN_EDITOR_EMBED_ENABLED:-true}"

  VECTOPLAN_CAD_PUBLIC_URL: "${VECTOPLAN_CAD_PUBLIC_URL:-http://localhost:5104}"
  VECTOPLAN_CAD_INTERNAL_URL: "${VECTOPLAN_CAD_INTERNAL_URL:-http://vectoplan-cad:5000}"
  VECTOPLAN_CAD_ROUTE: "${VECTOPLAN_CAD_ROUTE:-/cad}"
  VECTOPLAN_CAD_EMBED_ENABLED: "${VECTOPLAN_CAD_EMBED_ENABLED:-true}"

  VECTOPLAN_LIBRARY_PUBLIC_URL: "${VECTOPLAN_LIBRARY_PUBLIC_URL:-http://localhost:5101}"
  VECTOPLAN_LIBRARY_INTERNAL_URL: "${VECTOPLAN_LIBRARY_INTERNAL_URL:-http://vectoplan-library:5000}"

  VECTOPLAN_LV_PUBLIC_URL: "${VECTOPLAN_LV_PUBLIC_URL:-http://localhost:5105}"
  VECTOPLAN_LV_INTERNAL_URL: "${VECTOPLAN_LV_INTERNAL_URL:-http://vectoplan-lv:5000}"
  VECTOPLAN_LV_ROUTE: "${VECTOPLAN_LV_ROUTE:-/lv}"
  VECTOPLAN_LV_EMBED_ENABLED: "${VECTOPLAN_LV_EMBED_ENABLED:-true}"

  VECTOPLAN_VERGABE_PUBLIC_URL: "${VECTOPLAN_VERGABE_PUBLIC_URL:-http://localhost:5203/vergabe}"

  VECTOPLAN_FILECLOUD_PUBLIC_URL: "${VECTOPLAN_FILECLOUD_PUBLIC_URL:-http://localhost:5107}"
  VECTOPLAN_FILECLOUD_INTERNAL_URL: "${VECTOPLAN_FILECLOUD_INTERNAL_URL:-http://vectoplan-filecloud:5000}"
  VECTOPLAN_FILECLOUD_ROUTE: "${VECTOPLAN_FILECLOUD_ROUTE:-/files}"
  VECTOPLAN_FILECLOUD_EMBED_ENABLED: "${VECTOPLAN_FILECLOUD_EMBED_ENABLED:-true}"
  VECTOPLAN_FILECLOUD_ACCESS_TICKET_SECRET: "${VECTOPLAN_FILECLOUD_ACCESS_TICKET_SECRET:-dev-vectoplan-filecloud-access-ticket-secret-change-me}"
  VECTOPLAN_FILECLOUD_ACCESS_TICKET_TTL_SECONDS: "${VECTOPLAN_FILECLOUD_ACCESS_TICKET_TTL_SECONDS:-300}"

  VECTOPLAN_CHUNK_PUBLIC_URL: "${VECTOPLAN_CHUNK_PUBLIC_URL:-http://localhost:5102}"
  VECTOPLAN_CHUNK_PUBLIC_BASE_URL: "${VECTOPLAN_CHUNK_PUBLIC_BASE_URL:-http://localhost:5102}"
  VECTOPLAN_CHUNK_INTERNAL_URL: "${VECTOPLAN_CHUNK_INTERNAL_URL:-http://vectoplan-chunk:5000}"
  VECTOPLAN_CHUNK_INTERNAL_BASE_URL: "${VECTOPLAN_CHUNK_INTERNAL_BASE_URL:-http://vectoplan-chunk:5000}"

  # App -> Chunk service identity.
  VECTOPLAN_APP_CHUNK_SERVICE_ID: "${VECTOPLAN_APP_CHUNK_SERVICE_ID:-vectoplan-app}"
  VECTOPLAN_APP_CHUNK_SERVICE_API_KEY: "${VECTOPLAN_CHUNK_SERVICE_API_KEY:-dev-vectoplan-chunk-service-key-change-me}"
  VECTOPLAN_CHUNK_SERVICE_ID: "${VECTOPLAN_APP_CHUNK_SERVICE_ID:-vectoplan-app}"
  VECTOPLAN_CHUNK_SERVICE_API_KEY: "${VECTOPLAN_CHUNK_SERVICE_API_KEY:-dev-vectoplan-chunk-service-key-change-me}"
  VECTOPLAN_CHUNK_INTERNAL_TOKEN: "${VECTOPLAN_CHUNK_SERVICE_API_KEY:-dev-vectoplan-chunk-service-key-change-me}"
  VECTOPLAN_CHUNK_API_TOKEN: "${VECTOPLAN_CHUNK_SERVICE_API_KEY:-dev-vectoplan-chunk-service-key-change-me}"

  # App -> Core creates one idempotent translation project after the App
  # transaction. Core and App deliberately keep separate databases.
  VECTOPLAN_CORE_INTERNAL_URL: "${VECTOPLAN_CORE_INTERNAL_URL:-http://vectoplan-core:5000}"
  VECTOPLAN_APP_CORE_PROVISION_ON_PROJECT_CREATE: "${VECTOPLAN_APP_CORE_PROVISION_ON_PROJECT_CREATE:-true}"
  VECTOPLAN_APP_CORE_PROVISIONING_REQUIRED: "${VECTOPLAN_APP_CORE_PROVISIONING_REQUIRED:-true}"
  VECTOPLAN_APP_CORE_TIMEOUT_SECONDS: "${VECTOPLAN_APP_CORE_TIMEOUT_SECONDS:-10}"
  VECTOPLAN_APP_CORE_SERVICE_API_KEY: "${VECTOPLAN_CORE_INTERNAL_API_KEY:-dev-vectoplan-core-service-key-change-me}"

  # App projects request Earth. Flat is a server-controlled fallback only for
  # known Earth-reference/precondition errors; transport/auth/5xx failures do not
  # trigger fallback.
  VECTOPLAN_APP_DEFAULT_WORLD_TEMPLATE: "${VECTOPLAN_APP_DEFAULT_WORLD_TEMPLATE:-earth}"
  VECTOPLAN_APP_FALLBACK_WORLD_TEMPLATE: "${VECTOPLAN_APP_FALLBACK_WORLD_TEMPLATE:-flat}"
  VECTOPLAN_APP_ALLOW_WORLD_FALLBACK: "${VECTOPLAN_APP_ALLOW_WORLD_FALLBACK:-true}"
  VECTOPLAN_APP_ALLOW_WORLD_TEMPLATE_CHANGE: "${VECTOPLAN_APP_ALLOW_WORLD_TEMPLATE_CHANGE:-false}"
  VECTOPLAN_APP_CLIENT_SIDE_WORLD_FALLBACK: "${VECTOPLAN_APP_CLIENT_SIDE_WORLD_FALLBACK:-true}"
  VECTOPLAN_APP_EARTH_CRS_ID: "${VECTOPLAN_APP_EARTH_CRS_ID:-EPSG:4979}"
  VECTOPLAN_APP_DEFAULT_EARTH_HEIGHT: "${VECTOPLAN_APP_DEFAULT_EARTH_HEIGHT:-0.0}"
  VECTOPLAN_APP_CHUNK_FALLBACK_ERROR_CODES: "${VECTOPLAN_APP_CHUNK_FALLBACK_ERROR_CODES:-coordinates_unavailable,earth_reference_missing,earth_reference_required,earth_reference_incomplete,earth_reference_invalid,earth_reference_not_available,invalid_earth_reference,project_coordinates_unavailable,unsupported_coordinate_reference}"

  VECTOPLAN_APP_CHUNK_PROVISION_ON_PROJECT_CREATE: "${VECTOPLAN_APP_CHUNK_PROVISION_ON_PROJECT_CREATE:-true}"
  VECTOPLAN_APP_CHUNK_PROVISIONING_REQUIRED: "${VECTOPLAN_APP_CHUNK_PROVISIONING_REQUIRED:-true}"
  VECTOPLAN_CHUNK_PROVISION_ON_PROJECT_CREATE: "${VECTOPLAN_CHUNK_PROVISION_ON_PROJECT_CREATE:-true}"
  VECTOPLAN_CHUNK_PROVISION_REQUIRED: "${VECTOPLAN_CHUNK_PROVISION_REQUIRED:-true}"
  VECTOPLAN_CHUNK_PROVISION_TIMEOUT_SECONDS: "${VECTOPLAN_CHUNK_PROVISION_TIMEOUT_SECONDS:-10}"
  VECTOPLAN_CHUNK_PROVISION_RETRIES: "${VECTOPLAN_CHUNK_PROVISION_RETRIES:-2}"
  VECTOPLAN_CHUNK_PROVISION_RETRY_SECONDS: "${VECTOPLAN_CHUNK_PROVISION_RETRY_SECONDS:-1}"
  VECTOPLAN_CHUNK_PROVISION_DEFAULT_TEMPLATE_ID: "${VECTOPLAN_CHUNK_PROVISION_DEFAULT_TEMPLATE_ID:-earth}"
  VECTOPLAN_CHUNK_PROVISION_FALLBACK_TEMPLATE_ID: "${VECTOPLAN_CHUNK_PROVISION_FALLBACK_TEMPLATE_ID:-flat}"
  VECTOPLAN_CHUNK_PROVISION_DEFAULT_WORLD_ID: "${VECTOPLAN_CHUNK_PROVISION_DEFAULT_WORLD_ID:-world_spawn}"
  VECTOPLAN_CHUNK_PROVISION_API_PATH_ENSURE_BY_APP: "/projects/by-app/{app_project_public_id}"
  VECTOPLAN_CHUNK_PROVISION_API_PATH_ENSURE: "${VECTOPLAN_CHUNK_PROVISION_API_PATH_ENSURE:-/projects/ensure}"
  VECTOPLAN_CHUNK_PROVISION_API_PATH_PREVIEW_BY_APP: "/projects/preview/by-app/{app_project_public_id}"
  VECTOPLAN_CHUNK_STATUS_API_PATH: "${VECTOPLAN_CHUNK_STATUS_API_PATH:-/projects/_status}"
  VECTOPLAN_CHUNK_SERVICE_LINK_AUTO_CREATE: "${VECTOPLAN_CHUNK_SERVICE_LINK_AUTO_CREATE:-true}"
  VECTOPLAN_APP_PERSIST_CHUNK_FAILURE_STATE: "${VECTOPLAN_APP_PERSIST_CHUNK_FAILURE_STATE:-true}"

  # Full App-membership -> Chunk direct-assignment reconciliation.
  VECTOPLAN_APP_CHUNK_ACCESS_SYNC_ENABLED: "${VECTOPLAN_APP_CHUNK_ACCESS_SYNC_ENABLED:-true}"
  VECTOPLAN_APP_CHUNK_ACCESS_SYNC_REQUIRED: "${VECTOPLAN_APP_CHUNK_ACCESS_SYNC_REQUIRED:-true}"
  VECTOPLAN_APP_CHUNK_ACCESS_SYNC_ON_PROJECT_CREATE: "${VECTOPLAN_APP_CHUNK_ACCESS_SYNC_ON_PROJECT_CREATE:-true}"
  VECTOPLAN_APP_CHUNK_ACCESS_SYNC_ON_MEMBERSHIP_CHANGE: "${VECTOPLAN_APP_CHUNK_ACCESS_SYNC_ON_MEMBERSHIP_CHANGE:-true}"
  VECTOPLAN_APP_CHUNK_ACCESS_SYNC_ON_INVITATION_ACCEPT: "${VECTOPLAN_APP_CHUNK_ACCESS_SYNC_ON_INVITATION_ACCEPT:-true}"
  VECTOPLAN_APP_CHUNK_ACCESS_SYNC_ON_OWNER_TRANSFER: "${VECTOPLAN_APP_CHUNK_ACCESS_SYNC_ON_OWNER_TRANSFER:-true}"
  VECTOPLAN_APP_CHUNK_ACCESS_SYNC_STRICT_IDENTITIES: "${VECTOPLAN_APP_CHUNK_ACCESS_SYNC_STRICT_IDENTITIES:-true}"
  VECTOPLAN_APP_CHUNK_ACCESS_SYNC_PRUNE_STALE_DIRECT_ASSIGNMENTS: "${VECTOPLAN_APP_CHUNK_ACCESS_SYNC_PRUNE_STALE_DIRECT_ASSIGNMENTS:-true}"
  VECTOPLAN_APP_CHUNK_ACCESS_SYNC_VERIFY_AFTER_SYNC: "${VECTOPLAN_APP_CHUNK_ACCESS_SYNC_VERIFY_AFTER_SYNC:-true}"
  VECTOPLAN_APP_CHUNK_ACCESS_SYNC_FAIL_ON_PARTIAL_ERROR: "${VECTOPLAN_APP_CHUNK_ACCESS_SYNC_FAIL_ON_PARTIAL_ERROR:-true}"
  VECTOPLAN_APP_CHUNK_ACCESS_SYNC_FORWARD_PERMISSION_OVERRIDES: "${VECTOPLAN_APP_CHUNK_ACCESS_SYNC_FORWARD_PERMISSION_OVERRIDES:-false}"
  VECTOPLAN_APP_CHUNK_ACCESS_SYNC_TIMEOUT_SECONDS: "${VECTOPLAN_APP_CHUNK_ACCESS_SYNC_TIMEOUT_SECONDS:-10}"
  VECTOPLAN_APP_CHUNK_ACCESS_SYNC_RETRIES: "${VECTOPLAN_APP_CHUNK_ACCESS_SYNC_RETRIES:-2}"
  VECTOPLAN_APP_CHUNK_ACCESS_SYNC_RETRY_SECONDS: "${VECTOPLAN_APP_CHUNK_ACCESS_SYNC_RETRY_SECONDS:-1}"
  VECTOPLAN_CHUNK_ACCESS_API_PATH: "/projects/{chunk_project_id}/access"
  VECTOPLAN_CHUNK_ACCESS_INITIALIZE_API_PATH: "/projects/{chunk_project_id}/access/initialize"
  VECTOPLAN_CHUNK_ACCESS_PROJECTION_API_PATH: "/projects/{chunk_project_id}/access/projection"
  VECTOPLAN_CHUNK_ASSIGNMENTS_API_PATH: "/projects/{chunk_project_id}/assignments"
  VECTOPLAN_CHUNK_TRANSFER_OWNER_API_PATH: "/projects/{chunk_project_id}/access/transfer-owner"

  # Mapbox remains server-side. Autocomplete is temporary; coordinates stored
  # with projects are resolved through permanent Geocoding v6 requests.
  # Resolve every supported legacy name to one canonical value. This prevents
  # the App geocoder and OpenLayer from silently using different credentials.
  MAPBOX_ACCESS_TOKEN: "${MAPBOX_ACCESS_TOKEN:-${VECTOPLAN_MAPBOX_TOKEN:-${MAPBOX_TOKEN:-}}}"
  MAPBOX_TOKEN: "${MAPBOX_ACCESS_TOKEN:-${VECTOPLAN_MAPBOX_TOKEN:-${MAPBOX_TOKEN:-}}}"
  VECTOPLAN_MAPBOX_TOKEN: "${MAPBOX_ACCESS_TOKEN:-${VECTOPLAN_MAPBOX_TOKEN:-${MAPBOX_TOKEN:-}}}"
  VECTOPLAN_APP_MAPBOX_GEOCODING_ENABLED: "${VECTOPLAN_APP_MAPBOX_GEOCODING_ENABLED:-true}"
  VECTOPLAN_APP_MAPBOX_GEOCODING_ENDPOINT: "${VECTOPLAN_APP_MAPBOX_GEOCODING_ENDPOINT:-https://api.mapbox.com/search/geocode/v6/forward}"
  VECTOPLAN_APP_MAPBOX_LANGUAGE: "${VECTOPLAN_APP_MAPBOX_LANGUAGE:-de}"
  VECTOPLAN_APP_MAPBOX_COUNTRIES: "${VECTOPLAN_APP_MAPBOX_COUNTRIES:-de}"
  VECTOPLAN_APP_MAPBOX_TIMEOUT_SECONDS: "${VECTOPLAN_APP_MAPBOX_TIMEOUT_SECONDS:-4}"
  VECTOPLAN_APP_MAPBOX_PERMANENT_GEOCODING: "${VECTOPLAN_APP_MAPBOX_PERMANENT_GEOCODING:-true}"
  VECTOPLAN_APP_GEOCODING_FALLBACK_ENABLED: "${VECTOPLAN_APP_GEOCODING_FALLBACK_ENABLED:-true}"
  VECTOPLAN_APP_GEOCODING_FALLBACK_LONGITUDE: "${VECTOPLAN_APP_GEOCODING_FALLBACK_LONGITUDE:-13.405}"
  VECTOPLAN_APP_GEOCODING_FALLBACK_LATITUDE: "${VECTOPLAN_APP_GEOCODING_FALLBACK_LATITUDE:-52.52}"
  VECTOPLAN_APP_GEOCODING_FALLBACK_LABEL: "${VECTOPLAN_APP_GEOCODING_FALLBACK_LABEL:-Berlin, Deutschland (Standardstandort)}"
  VECTOPLAN_APP_GEOREFERENCE_GEOCODER_ENABLED: "${VECTOPLAN_APP_GEOREFERENCE_GEOCODER_ENABLED:-true}"
  VECTOPLAN_APP_GEOREFERENCE_DISCOVER_GEOCODER: "${VECTOPLAN_APP_GEOREFERENCE_DISCOVER_GEOCODER:-true}"
  VECTOPLAN_APP_GEOREFERENCE_ALLOW_COORDINATE_SWAP: "${VECTOPLAN_APP_GEOREFERENCE_ALLOW_COORDINATE_SWAP:-false}"
  VECTOPLAN_APP_PERSIST_DERIVED_GEOREFERENCE: "${VECTOPLAN_APP_PERSIST_DERIVED_GEOREFERENCE:-true}"

  # Embed URLs use configured origins only. Request Host is not trusted.
  VECTOPLAN_EMBED_PREFER_REQUEST_HOST: "${VECTOPLAN_EMBED_PREFER_REQUEST_HOST:-false}"
  # Localhost and 127.0.0.1 are matched only within a strict loopback
  # allowlist so the App -> Editor cookie exchange stays same-site.
  VECTOPLAN_EMBED_MATCH_LOOPBACK_HOST: "${VECTOPLAN_EMBED_MATCH_LOOPBACK_HOST:-true}"
  VECTOPLAN_EMBED_ALLOWED_APP_ORIGINS: "${VECTOPLAN_EMBED_ALLOWED_APP_ORIGINS:-http://localhost:5103,http://127.0.0.1:5103}"
  VECTOPLAN_EDITOR_PUBLIC_VIEWER_EMBED_ENABLED: "${VECTOPLAN_EDITOR_PUBLIC_VIEWER_EMBED_ENABLED:-true}"

  GEOSERVER_ORCHESTRATOR_PUBLIC_URL: "${GEOSERVER_ORCHESTRATOR_PUBLIC_URL:-http://127.0.0.1:5109/geodaten}"
  GEOSERVER_ORCHESTRATOR_INTERNAL_URL: "${GEOSERVER_ORCHESTRATOR_INTERNAL_URL:-http://geoserver-orchestrator:8010}"
  GEOSERVER_INTERNAL_BASE_URL: "${GEOSERVER_INTERNAL_BASE_URL:-http://geoserver:8080/geoserver}"
  GEOSERVER_PUBLIC_BASE_URL: "${GEOSERVER_PUBLIC_BASE_URL:-http://127.0.0.1:5109/geoserver}"

  OPENLAYER_PUBLIC_URL: "${OPENLAYER_PUBLIC_URL:-http://localhost:5190}"
  OPENLAYER_PUBLIC_BASE_URL: "${OPENLAYER_PUBLIC_BASE_URL:-http://localhost:5190}"
  OPENLAYER_INTERNAL_URL: "${OPENLAYER_INTERNAL_URL:-http://openlayer:8090}"
  OPENLAYER_ROUTE: "${OPENLAYER_ROUTE:-/map}"
  OPENLAYER_EMBED_ENABLED: "${OPENLAYER_EMBED_ENABLED:-true}"
  MAP_PROJECT_ZOOM: "${MAP_PROJECT_ZOOM:-17}"

  GUNICORN_WORKERS: "${VECTOPLAN_APP_GUNICORN_WORKERS:-2}"
  GUNICORN_THREADS: "${VECTOPLAN_APP_GUNICORN_THREADS:-4}"
  GUNICORN_TIMEOUT: "${VECTOPLAN_APP_GUNICORN_TIMEOUT:-120}"
  GUNICORN_KEEPALIVE: "${VECTOPLAN_APP_GUNICORN_KEEPALIVE:-5}"
  GUNICORN_LOG_LEVEL: "${VECTOPLAN_APP_GUNICORN_LOG_LEVEL:-info}"
  GUNICORN_ACCESSLOG: "${VECTOPLAN_APP_GUNICORN_ACCESSLOG:--}"
  GUNICORN_ERRORLOG: "${VECTOPLAN_APP_GUNICORN_ERRORLOG:--}"

services:
  vectoplan-libretranslate-init:
    <<: *vectoplan-init-service-defaults
    image: libretranslate/libretranslate:latest
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        set -eu
        mkdir -p /data/share /data/cache
        chown -R 1032:65534 /data
        echo "[vectoplan-libretranslate-init] /data ownership is ready."
    volumes:
      - vectoplan-language-data:/data
    networks:
      vectoplan-net:
        aliases:
          - vectoplan-libretranslate-init

  vectoplan-libretranslate:
    <<: *vectoplan-service-defaults
    image: libretranslate/libretranslate:latest
    depends_on:
      vectoplan-libretranslate-init:
        condition: service_completed_successfully
    environment:
      <<: *vectoplan-python-environment
      XDG_DATA_HOME: "/data/share"
      XDG_CACHE_HOME: "/data/cache"
      LT_LOAD_ONLY: "${LIBRETRANSLATE_LOAD_ONLY:-en,de}"
      LT_DISABLE_WEB_UI: "true"
    volumes:
      - vectoplan-language-data:/data
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD",
          "/app/venv/bin/python",
          "-c",
          "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:5000/languages', timeout=5); raise SystemExit(0 if response.status == 200 else 1)"
        ]
      interval: "${LIBRETRANSLATE_HEALTH_INTERVAL:-15s}"
      timeout: "${LIBRETRANSLATE_HEALTH_TIMEOUT:-10s}"
      retries: ${LIBRETRANSLATE_HEALTH_RETRIES:-60}
      start_period: "${LIBRETRANSLATE_HEALTH_START_PERIOD:-60s}"
    networks:
      vectoplan-net:
        aliases:
          - vectoplan-libretranslate

  vectoplan-language:
    <<: *vectoplan-service-defaults
    build:
      context: ./services/vectoplan-language
    environment:
      <<: *vectoplan-python-environment
      PORT: "8000"
      SERVICE_NAME: "vectoplan-language"
      LT_BASE_URL: "http://vectoplan-libretranslate:5000"
      ALLOWED_LANGS: "${VECTOPLAN_LANGUAGE_ALLOWED:-en,de}"
      READY_MIN_LANGS: "${VECTOPLAN_LANGUAGE_READY_MIN:-en,de}"
      LT_INSTALL_LANGS: "${VECTOPLAN_LANGUAGE_INSTALL:-de}"
      DEFAULT_TARGETS_SOURCE: "available"
      WAIT_FOR_UPSTREAM: "true"
      WAIT_UPSTREAM_URL: "http://vectoplan-libretranslate:5000/languages"
      WAIT_UPSTREAM_TIMEOUT_SEC: "${VECTOPLAN_LANGUAGE_WAIT_SECONDS:-600}"
      MAX_CHARS: "${VECTOPLAN_LANGUAGE_MAX_CHARS:-10000}"
      MAX_TARGETS: "${VECTOPLAN_LANGUAGE_MAX_TARGETS:-5}"
      CACHE_ENABLED: "true"
      CACHE_TTL_SEC: "${VECTOPLAN_LANGUAGE_CACHE_TTL:-86400}"
      CACHE_MAX_ITEMS: "${VECTOPLAN_LANGUAGE_CACHE_ITEMS:-50000}"
      RATE_LIMIT_ENABLED: "false"
      SELFTEST_ENABLED: "true"
    depends_on:
      vectoplan-libretranslate:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/_ready"]
      interval: "${VECTOPLAN_LANGUAGE_HEALTH_INTERVAL:-10s}"
      timeout: "${VECTOPLAN_LANGUAGE_HEALTH_TIMEOUT:-5s}"
      retries: ${VECTOPLAN_LANGUAGE_HEALTH_RETRIES:-30}
      start_period: "${VECTOPLAN_LANGUAGE_HEALTH_START_PERIOD:-20s}"
    networks:
      vectoplan-net:
        aliases:
          - vectoplan-language

  vectoplan-library-db:
    <<: *vectoplan-service-defaults
    image: postgres:16-alpine
    environment:
