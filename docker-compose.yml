  VECTOPLAN_CHUNK_EDITOR_DATASET_ROOT: "/var/lib/vectoplan-chunk/terrain-cache/editor-datasets"
  VECTOPLAN_CHUNK_TERRAIN_REQUEST_TIMEOUT_SECONDS: "${VECTOPLAN_CHUNK_TERRAIN_REQUEST_TIMEOUT_SECONDS:-20}"
  VECTOPLAN_CHUNK_TERRAIN_VERSION_CACHE_SECONDS: "${VECTOPLAN_CHUNK_TERRAIN_VERSION_CACHE_SECONDS:-60}"
  VECTOPLAN_CHUNK_TERRAIN_RADIUS_M: "${VECTOPLAN_CHUNK_TERRAIN_RADIUS_M:-10}"
  VECTOPLAN_CHUNK_TERRAIN_REGION_ENABLED: "${VECTOPLAN_CHUNK_TERRAIN_REGION_ENABLED:-true}"
  VECTOPLAN_CHUNK_TERRAIN_PREPARE_ON_PROJECT_SAVE: "${VECTOPLAN_CHUNK_TERRAIN_PREPARE_ON_PROJECT_SAVE:-true}"
  VECTOPLAN_CHUNK_TERRAIN_REGION_RADIUS_CHUNKS: "${VECTOPLAN_CHUNK_TERRAIN_REGION_RADIUS_CHUNKS:-64}"
  VECTOPLAN_CHUNK_TERRAIN_REGION_SAMPLE_STEP_CHUNKS: "${VECTOPLAN_CHUNK_TERRAIN_REGION_SAMPLE_STEP_CHUNKS:-2}"
  VECTOPLAN_CHUNK_TERRAIN_REGION_BATCH_POINTS: "${VECTOPLAN_CHUNK_TERRAIN_REGION_BATCH_POINTS:-480}"

  # App is the source of truth for project membership. Chunk stores and enforces
  # only the synchronized direct access projection.
  VECTOPLAN_CHUNK_ACCESS_CONTROL_ENABLED: "${VECTOPLAN_CHUNK_ACCESS_CONTROL_ENABLED:-true}"
  VECTOPLAN_CHUNK_ACCESS_DEFAULT_DENY: "${VECTOPLAN_CHUNK_ACCESS_DEFAULT_DENY:-true}"
  VECTOPLAN_CHUNK_PROJECT_ACCESS_AUTHZ_ENFORCED: "${VECTOPLAN_CHUNK_PROJECT_ACCESS_AUTHZ_ENFORCED:-true}"
  VECTOPLAN_CHUNK_ACCESS_STRICT_CANONICAL_USER_IDS: "${VECTOPLAN_CHUNK_ACCESS_STRICT_CANONICAL_USER_IDS:-true}"
  VECTOPLAN_CHUNK_ACCESS_ALLOWED_ROLES: "${VECTOPLAN_CHUNK_ACCESS_ALLOWED_ROLES:-owner,admin,editor,viewer}"
  VECTOPLAN_CHUNK_ACCESS_VIEWER_READ_ONLY: "${VECTOPLAN_CHUNK_ACCESS_VIEWER_READ_ONLY:-true}"
  VECTOPLAN_CHUNK_ACCESS_ALLOW_PUBLIC_MUTATIONS: "${VECTOPLAN_CHUNK_ACCESS_ALLOW_PUBLIC_MUTATIONS:-false}"
  VECTOPLAN_CHUNK_ACCESS_ALLOW_IDENTITY_OVERRIDE: "${VECTOPLAN_CHUNK_ACCESS_ALLOW_IDENTITY_OVERRIDE:-false}"
  VECTOPLAN_CHUNK_ACCESS_PRUNE_STALE_DIRECT_ASSIGNMENTS: "${VECTOPLAN_CHUNK_ACCESS_PRUNE_STALE_DIRECT_ASSIGNMENTS:-true}"
  VECTOPLAN_CHUNK_ACCESS_VERIFY_AFTER_SYNC: "${VECTOPLAN_CHUNK_ACCESS_VERIFY_AFTER_SYNC:-true}"
  VECTOPLAN_CHUNK_ACCESS_API_PATH: "/projects/{chunk_project_id}/access"
  VECTOPLAN_CHUNK_ACCESS_INITIALIZE_API_PATH: "/projects/{chunk_project_id}/access/initialize"
  VECTOPLAN_CHUNK_ACCESS_PROJECTION_API_PATH: "/projects/{chunk_project_id}/access/projection"
  VECTOPLAN_CHUNK_ASSIGNMENTS_API_PATH: "/projects/{chunk_project_id}/assignments"
  VECTOPLAN_CHUNK_TRANSFER_OWNER_API_PATH: "/projects/{chunk_project_id}/access/transfer-owner"

  VECTOPLAN_CHUNK_HEALTHCHECK_PATH: "${VECTOPLAN_CHUNK_HEALTHCHECK_PATH:-/health/ready}"
  VECTOPLAN_CHUNK_HEALTHCHECK_REQUIRE_OK: "${VECTOPLAN_CHUNK_HEALTHCHECK_REQUIRE_OK:-true}"

  VECTOPLAN_CHUNK_RUN_MODE: "${VECTOPLAN_CHUNK_RUN_MODE:-gunicorn}"
  GUNICORN_APP: "${VECTOPLAN_CHUNK_GUNICORN_APP:-wsgi:app}"
  # Keep interactive chunk loads and readiness independent from CPU-heavy
  # projection/index requests. Each worker keeps its own bounded placement
  # index, so two workers provide isolation without unbounded memory growth.
  GUNICORN_WORKERS: "${VECTOPLAN_CHUNK_GUNICORN_WORKERS:-2}"
  GUNICORN_THREADS: "${VECTOPLAN_CHUNK_GUNICORN_THREADS:-8}"
  GUNICORN_TIMEOUT: "${VECTOPLAN_CHUNK_GUNICORN_TIMEOUT:-120}"
  GUNICORN_KEEPALIVE: "${VECTOPLAN_CHUNK_GUNICORN_KEEPALIVE:-5}"
  GUNICORN_LOG_LEVEL: "${VECTOPLAN_CHUNK_GUNICORN_LOG_LEVEL:-info}"
  GUNICORN_ACCESSLOG: "${VECTOPLAN_CHUNK_GUNICORN_ACCESSLOG:--}"
  GUNICORN_ERRORLOG: "${VECTOPLAN_CHUNK_GUNICORN_ERRORLOG:--}"

