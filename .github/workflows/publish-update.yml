name: VECTOPLAN Server Update

on:
  push:
    branches: [main]
    tags: ["v*", "vectoplan-server-v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: vectoplan-server-update-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out server and private service repositories
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VECTOPLAN_REPOSITORY_READ_TOKEN || github.token }}

      - name: Build tracked server archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#vectoplan-server-v}"
          version="${version#v}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="0.0.0-${GITHUB_SHA::12}"
          fi
          mkdir -p artifacts
          archive="artifacts/vectoplan-server-${version}.zip"
          python scripts/build_update_archive.py --output "${archive}" --version "${version}"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Upload verified server package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vectoplan-server-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach package to immutable GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            "${ARCHIVE_PATH}" "${ARCHIVE_PATH}.sha256" \
            --verify-tag \
            --title "VECTOPLAN Server ${RELEASE_TAG}" \
            --generate-notes
