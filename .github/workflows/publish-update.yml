name: VECTOPLAN Server Release Coordinator

on:
  push:
    tags: ["vectoplan-server-v*"]
  workflow_dispatch:

concurrency:
  group: vectoplan-server-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-lock:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out coordinator without private submodules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Write immutable component lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          entries = []
          raw = subprocess.check_output(
              ["git", "ls-tree", "-r", "HEAD", "services"], text=True
          )
          for line in raw.splitlines():
              metadata, path = line.split("\t", 1)
              mode, kind, object_id = metadata.split(" ", 2)
              if mode == "160000" and kind == "commit":
                  entries.append({"path": path, "commit": object_id})
          payload = {
              "schema_version": 1,
              "repository": "${{ github.repository }}",
              "tag": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "components": sorted(entries, key=lambda item: item["path"]),
              "delivery": "vectoplan-updates fetches each submodule repository separately",
          }
          Path("artifacts/vectoplan-server-components.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Publish coordinator release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            artifacts/vectoplan-server-components.json \
            --verify-tag \
            --title "VECTOPLAN Server ${RELEASE_TAG}" \
            --generate-notes
