name: Desktop server bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out server and all submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build complete desktop bundle
        run: >-
          python scripts/build_desktop_bundle.py
          --version "${GITHUB_REF_NAME}"
          --output-directory dist

      - name: Publish immutable release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/vectoplan-server-"${GITHUB_REF_NAME}"-desktop.zip
          dist/vectoplan-server-"${GITHUB_REF_NAME}"-desktop.zip.sha256
          --verify-tag
          --generate-notes
