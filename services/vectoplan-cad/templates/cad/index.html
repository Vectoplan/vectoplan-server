<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <title data-i18n="vectoplan.server.cad.cad.index.title.cad_erdgeschoss.35c0caf3">CAD · Erdgeschoss</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='cad/css/main.css') }}?v=20260815-cad-tools-4">
</head>
<body>
  <main class="cad-app" data-route-prefix="{{ route_prefix }}">
    <section class="workspace" aria-label="CAD-Arbeitsfläche Erdgeschoss" data-i18n-aria-label="server.cad.cad.index.section_aria-label.cad_arbeitsfl_che_erdgeschoss.0df37f40">

      <div class="workspace-actions">
        <div class="toolbar-group history-tools" aria-label="Verlauf" data-i18n-aria-label="server.cad.cad.index.div_aria-label.verlauf.8f0003a4">
          <button type="button" data-action="undo" disabled title="Rückgängig (Strg+Z)" aria-label="Rückgängig" data-i18n-aria-label="server.cad.cad.index.button_aria-label.r_ckg_ngig.3ca38d3e" data-i18n-title="server.cad.cad.index.button_title.r_ckg_ngig_strg_z.d2e8a1e4">↶</button>
          <button type="button" data-action="redo" disabled title="Wiederholen (Strg+Y)" aria-label="Wiederholen" data-i18n-aria-label="server.cad.cad.index.button_aria-label.wiederholen.58855d68" data-i18n-title="server.cad.cad.index.button_title.wiederholen_strg_y.e3466463">↷</button>
        </div>
      </div>
      <div class="cad-authoring" aria-label="CAD- und WorldEdit-Werkzeuge">
        <div class="cad-tool-rail" aria-label="Zeichenwerkzeuge">
          <button type="button" class="cad-tool-button is-active" data-tool="select" title="Auswählen" aria-label="Auswählen"><span aria-hidden="true">⌖</span><small>Auswahl</small></button>
          <button type="button" class="cad-tool-button" data-tool="parcel-grid" title="Grundstücksraster anpassen" aria-label="Grundstücksraster anpassen"><span aria-hidden="true">▦</span><small>Raster</small></button>
          <button type="button" class="cad-tool-button" data-quick-tool="wall" title="Wand zeichnen (Umschalt = 45°)" aria-label="Wand zeichnen"><span aria-hidden="true">╱</span><small>Wand</small></button>
          <button type="button" class="cad-tool-button" data-quick-tool="room" title="Raum zeichnen" aria-label="Raum zeichnen"><span aria-hidden="true">▱</span><small>Raum</small></button>
          <button type="button" class="cad-tool-button" data-quick-tool="window" title="Fenster einsetzen" aria-label="Fenster einsetzen"><span aria-hidden="true">▭</span><small>Fenster</small></button>
          <button type="button" class="cad-tool-button" data-quick-tool="door" title="Tür einsetzen" aria-label="Tür einsetzen"><span aria-hidden="true">◿</span><small>Tür</small></button>
          <button type="button" class="cad-tool-button" data-quick-tool="stair" title="Treppenbereich zeichnen" aria-label="Treppenbereich zeichnen"><span aria-hidden="true">▥</span><small>Treppe</small></button>
          <button type="button" class="cad-tool-button cad-tool-button--library" data-action="toggle-library" title="Weitere Bauteile" aria-label="Creative Library öffnen"><span aria-hidden="true">＋</span><small>Mehr</small></button>
        </div>
        <div class="cad-active-library" id="active-library-item" hidden>
          <span id="active-library-kind">Library</span>
          <strong id="active-library-label">–</strong>
          <small id="active-library-variant">–</small>
        </div>
        <section class="cad-library-panel" id="library-panel" hidden aria-label="Creative Library">
          <div class="cad-library-panel__header">
            <div><span>VECTOPLAN</span><strong>Creative Library</strong></div>
            <button type="button" data-action="toggle-library" aria-label="Creative Library schließen">×</button>
          </div>
          <label class="cad-library-search">
            <span class="visually-hidden">Creative Library durchsuchen</span>
            <input id="library-search" type="search" placeholder="Wand, Fenster, Tür, WDVS …" autocomplete="off">
          </label>
          <div class="cad-library-filters" id="library-filters" role="tablist" aria-label="Library-Kategorien"></div>
          <div id="library-status" class="cad-library-status">Creative Library wird geladen …</div>
          <div id="library-grid" class="cad-library-grid"></div>
        </section>
      </div>
      <div class="workspace-canvas" id="workspace-canvas">
        <svg id="plan-svg" role="img" aria-label="Erdgeschoss-Grundriss auf unbegrenzter Modellfläche"></svg>
      </div>
      <div class="navigation-hint">
        <span class="desktop-hint">Mausrad: Zoom · Umschalt beim Zeichnen: 45° · Umschalt + Mausrad: horizontal · Mittlere Maustaste: verschieben</span>
        <span class="touch-hint" data-i18n="vectoplan.server.cad.cad.index.span.ziehen_verschieben_zwei_finger_zoomen.d0c629ea">Ziehen: verschieben · Zwei Finger: zoomen</span>
      </div>
      <div id="workspace-message" class="workspace-message" role="status" aria-live="polite" hidden></div>
    </section>

  </main>

  <script src="{{ url_for('static', filename='cad/js/main.js') }}?v=20260815-cad-tools-4" defer></script>
</body>
</html>
